# How the server the nginx service writes at start passes requests to Tautulli.

# A database or configuration imported under Settings comes through here. nginx
# reads it whole before passing it on, so that Tautulli is told its length even
# when ingress streams it in chunks.
client_max_body_size 0;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
# Tautulli reads these only because the application turns on its reverse proxy
# setting, and nginx alone writes them; see the maps in nginx.conf.
proxy_set_header X-Forwarded-For $client_addr;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Real-IP '';
proxy_set_header Forwarded '';
proxy_set_header Via '';
# An export or a database import answers only once it is done.
proxy_read_timeout 1h;
proxy_send_timeout 1h;
# Behind Traefik, an absolute redirect would name this port rather than the one
# the browser used.
absolute_redirect off;
