# nginx here serves one thing: Tautulli, on 8181, for ingress and the published
# port alike. Tautulli itself listens on 127.0.0.1:18181, and the nginx service
# writes the server for it at start, from the HTTP root in Tautulli's
# config.ini.
daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    # Tautulli runs under the ingress path as its HTTP root, so every address it
    # writes carries that path. The path has to go back onto requests on the way
    # in: Supervisor strips it before an ingress request arrives here, and
    # Traefik, Home Assistant's Tautulli integration and everything else calling
    # the published port never send it. On the way out, ingress needs the path
    # left where Tautulli wrote it, and the published port needs it taken out
    # again, so that a browser at home sees Tautulli's own addresses. The maps
    # that name the path are written beside the server, since only the nginx
    # service knows it.

    # Supervisor marks every ingress request with X-Ingress-Path. Anything
    # without it came in on the published port.
    map $http_x_ingress_path $from_ingress {
        default 1;
        '' 0;
    }

    # nginx cannot rewrite a compressed response, so the published port asks
    # Tautulli for an uncompressed one, and nginx compresses it after the
    # rewrite. Ingress gets what the browser asked for, since nothing in it is
    # rewritten.
    map $from_ingress $upstream_accept_encoding {
        1 $http_accept_encoding;
        0 '';
    }

    # A page opened on the published port under the path, such as a link copied
    # out of ingress, is sent to the same page without it. API callers, and the
    # chat services that fetch a notification's poster, do not ask for HTML, so
    # they are answered where they asked.
    map "$from_ingress:$http_accept" $redirect_out_of_base {
        default 0;
        "~^0:.*text/html" 1;
    }

    # Tautulli takes the client's address from the first entry of
    # X-Forwarded-For, for its login history and for locking an address out
    # after ten wrong passwords, and from the last for refusing anyone outside
    # the local network while no password is set. nginx therefore sends one
    # entry, which a client cannot choose: the address nginx was connected
    # from, with one exception. Supervisor relays every ingress request from
    # 172.30.32.2, after Home Assistant has added the address it was connected
    # from to X-Forwarded-For and Supervisor has added Home Assistant's,
    # 172.30.32.1, after it. The address before that one is the browser, and
    # nothing a browser sends can come after it. Anything else from 172.30.32.2
    # is that address, as is everything that comes through Traefik.
    map "$remote_addr $http_x_forwarded_for" $client_addr {
        default $remote_addr;
        "~^172\.30\.32\.2 (.*,)?\s*(?<via_home_assistant>[0-9A-Fa-f:.]+),\s*172\.30\.32\.1$" $via_home_assistant;
    }

    # Tautulli builds its redirects from X-Forwarded-Proto. nginx itself only
    # ever speaks http, so the scheme is the one Traefik, or Home Assistant
    # through ingress, says it was. Only https is taken from them.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }

    include /etc/nginx/servers/*.conf;
}
