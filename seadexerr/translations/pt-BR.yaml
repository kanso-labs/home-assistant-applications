configuration:
  animebytes_passkey:
    description: >-
      Opcional. Oferece também os lançamentos do AnimeBytes que o SeaDex lista,
      com links de download que carregam esta passkey.
    name: Passkey do AnimeBytes
  log_level:
    description: Quanto detalhe o Seadexerr escreve no log.
    name: Nível de log
  radarr_api_key:
    description: >-
      Nas configurações do Radarr, em Geral. Deixe vazia para deixar os filmes
      de fora.
    name: Chave de API do Radarr
  radarr_url:
    description: >-
      Onde o Radarr é acessado. O padrão é a aplicação Radarr deste repositório.
    name: Endereço do Radarr
  sonarr_api_key:
    description: >-
      Nas configurações do Sonarr, em Geral. Deixe vazia para deixar as séries
      de fora.
    name: Chave de API do Sonarr
  sonarr_url:
    description: >-
      Onde o Sonarr é acessado. O padrão é a aplicação Sonarr deste repositório.
    name: Endereço do Sonarr
network:
  2071/tcp: >-
    Só para um Prowlarr fora do Home Assistant. Um Prowlarr dentro dele acessa o
    Seadexerr em http://2dd33fbd-seadexerr:2071 sem abrir porta nenhuma.
