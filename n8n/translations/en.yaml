configuration:
  enable_ssl:
    description: >-
      Requires n8n's session cookie to travel over HTTPS. Turn it on only when
      you reach Home Assistant over HTTPS; over plain HTTP, n8n will not let you
      sign in.
    name: HTTPS-only session cookie
  env_vars:
    description: >-
      More of n8n's environment variables, each a name and a value, for the many
      settings n8n reads that have no option here. The ones this application
      sets itself cannot be changed this way.
    fields:
      name:
        description: >-
          The variable's name, in capital letters, digits and underscores, such
          as EXECUTIONS_DATA_MAX_AGE.
        name: Name
      value:
        description: The value to give it, such as 72.
        name: Value
    name: Environment variables
  home_assistant_credential:
    description: >-
      Keeps a Home Assistant credential in n8n that needs no access token. Turn
      it off and the credential stays in n8n but stops working.
    name: Home Assistant credential
  log_level:
    description: How much detail n8n writes to its log.
    name: Log level
  mariadb_credential:
    description: >-
      Keeps a MariaDB credential in n8n for the MariaDB application, once it is
      installed. Turn it off and the credential stays in n8n, no longer updated.
    name: MariaDB credential
  max_old_space_size:
    description: >-
      The most memory n8n may use for its heap, in megabytes. Raise it when
      large workflows run out of memory; leave it empty to let Node decide.
    name: Maximum heap size (MB)
  mqtt_credential:
    description: >-
      Keeps an MQTT credential in n8n for the Mosquitto broker, once it is
      installed. Turn it off and the credential stays in n8n, no longer updated.
    name: MQTT credential
  node_function_external_modules:
    description: npm modules that Code nodes are allowed to import.
    name: External modules for Code nodes
  webhook_url:
    description: >-
      The address that reaches this application from outside Home Assistant,
      such as https://n8n.example.com. n8n gives it out for webhook triggers,
      and as the address OAuth providers send you back to. Leave it empty unless
      you have published the port and put something in front of it.
    name: External address
network:
  5678/tcp: The port n8n listens on, for reaching it without ingress.
