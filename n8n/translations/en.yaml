configuration:
  enable_ssl:
    description: Enable SSL for the n8n instance.
    name: Enable SSL
  enable_task_runners:
    description: >
      The task runner feature consists of three components: a task runner, a
      task broker, and a task requester.
    name: Enable task runners
  log_level:
    description: How much detail n8n writes to its log.
    name: Log level
  node_function_external_modules:
    description: npm modules that Code nodes are allowed to import.
    name: External modules for Code nodes
  webhook_url:
    description: >-
      The address that reaches this application from outside Home Assistant,
      such as https://n8n.example.com. n8n shows it when you build a webhook
      trigger. Leave it empty unless you have published the port and put
      something in front of it.
    name: External webhook address
network:
  5678/tcp: The port n8n listens on, for reaching it without ingress.
