configuration:
  enable_ssl:
    description: >-
      Exige que o cookie de sessão do n8n trafegue por HTTPS. Ative somente se
      você acessa o Home Assistant por HTTPS; em HTTP simples, o n8n não
      permitirá o login.
    name: Cookie de sessão somente por HTTPS
  env_vars:
    description: >-
      Outras variáveis de ambiente do n8n, cada uma com nome e valor, para as
      muitas configurações que o n8n lê e que não têm opção aqui. As que esta
      aplicação define por conta própria não podem ser alteradas assim.
    name: Variáveis de ambiente
  log_level:
    description: Quanto detalhe o n8n registra no log.
    name: Nível de log
  max_old_space_size:
    description: >-
      A memória máxima que o n8n pode usar para o heap, em megabytes. Aumente
      quando workflows grandes ficarem sem memória; deixe vazio para o Node
      decidir.
    name: Tamanho máximo do heap (MB)
  node_function_external_modules:
    description: Módulos npm que os nós Code podem importar.
    name: Módulos externos para nós Code
  webhook_url:
    description: >-
      O endereço que alcança esta aplicação de fora do Home Assistant, como
      https://n8n.example.com. O n8n o usa nos gatilhos de webhook e como o
      endereço para onde os provedores OAuth enviam você de volta. Deixe vazio a
      menos que você tenha publicado a porta e colocado algo na frente dela.
    name: Endereço externo
network:
  5678/tcp: A porta em que o n8n escuta, para alcançá-lo sem o ingress.
