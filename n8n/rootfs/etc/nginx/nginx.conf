# nginx here serves one thing: the stand-in for Home Assistant's API that the
# ready-made credential points at. n8n itself is reached directly, on 5678.
daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log stderr error;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;

    include /etc/nginx/servers/*.conf;
}
