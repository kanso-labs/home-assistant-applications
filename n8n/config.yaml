arch:
  - aarch64
  - amd64
backup: cold
backup_exclude:
  - '.cache/**'
  - '.n8n/crash.journal'
  - '.n8n/n8nEventLog*.log'
description:
  Flexible AI workflow automation for technical teams. Build with the precision
  of code or the speed of drag-n-drop. Host with on-prem control or in-the-cloud
  convenience. n8n gives you more freedom to implement multi-step AI agents and
  integrate apps than any other tool.
image: 'ghcr.io/kanso-labs/home-assistant-application-n8n'
ingress: true
ingress_port: 5678
ingress_stream: true
init: false
map:
  - read_only: true
    type: share
name: n8n
options:
  enable_ssl: false
  env_vars: []
  log_level: info
  node_function_external_modules: []
  webhook_url: ''
panel_icon: 'mdi:diversify'
ports:
  5678/tcp: null
# The options are in the order the Configuration tab shows them: this
# application's own settings first, then the heap size and the variables that
# reach the rest of n8n's settings. That is why they are not alphabetical.
schema:
  enable_ssl: bool
  log_level: list(debug|info|warn|error)
  node_function_external_modules: [str]
  webhook_url: str?
  max_old_space_size: int?
  env_vars:
    - name: match(^[A-Z][A-Z0-9_]*$)
      value: str
slug: n8n
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/n8n'
version: '1.3.3' # x-release-please-version
