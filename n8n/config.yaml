arch:
  - aarch64
  - amd64
backup: cold
backup_exclude:
  - '.cache/**'
  - '.n8n/crash.journal'
  - '.n8n/n8nEventLog*.log'
description:
  Workflow automation that connects your services and Home Assistant, with a
  visual editor, code steps and AI nodes. n8n opens inside Home Assistant
  through ingress, and Home Assistant can call its webhooks with no port
  published.
# What makes the Home Assistant credential work without a token: Supervisor
# hands this application a token for the Core API, which the proxy in nginx adds
# to every request. The grant holds whether or not the credential is used, and
# it reaches as far as an administrator's token, which is what anyone using the
# Home Assistant node without it already pastes in. Decided in #506.
homeassistant_api: true
image: 'ghcr.io/kanso-labs/home-assistant-application-n8n'
ingress: true
ingress_port: 5678
ingress_stream: true
init: false
map:
  - read_only: true
    type: share
name: n8n
options:
  enable_ssl: false
  env_vars: []
  home_assistant_credential: true
  log_level: info
  mariadb_credential: true
  mqtt_credential: true
  node_function_external_modules: []
  webhook_url: ''
panel_icon: 'mdi:diversify'
ports:
  5678/tcp: null
# The options are in the order the Configuration tab shows them: this
# application's own settings first, then the heap size and the variables that
# reach the rest of n8n's settings. That is why they are not alphabetical.
schema:
  enable_ssl: bool
  log_level: list(debug|info|warn|error)
  node_function_external_modules: [str]
  webhook_url: str?
  home_assistant_credential: bool
  mqtt_credential: bool
  mariadb_credential: bool
  max_old_space_size: int?
  env_vars:
    - name: match(^[A-Z][A-Z0-9_]*$)
      value: str
# Wanted rather than needed: n8n starts without a broker or a database, and
# only the credentials for them wait until one is installed.
services:
  - 'mqtt:want'
  - 'mysql:want'
slug: n8n
# How long Supervisor lets the application stop before Docker kills it, in
# seconds, up from its default of 10. n8n gives running workflows 30 seconds to
# finish before it exits, and records any it had to cut off as crashed.
timeout: 60
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/n8n'
version: '1.6.9' # x-release-please-version
