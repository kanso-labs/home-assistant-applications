arch:
  - aarch64
  - amd64
description:
  Extracts completed downloads for the arr applications. Unpackerr watches what
  Radarr and Sonarr are waiting on, unpacks archives in place, and cleans up
  once they have been imported.
image: 'ghcr.io/kanso-labs/home-assistant-application-unpackerr'
# nginx answers ingress on 8099, the default ingress_port, and hands it to
# Unpackerr on 5656, see DOCS.md.
ingress: true
init: false
map:
  - read_only: false
    type: app_config
  - read_only: false
    type: media
  - read_only: false
    type: share
name: Unpackerr
panel_icon: 'mdi:package-variant'
slug: unpackerr
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/unpackerr'
version: '2.1.3' # x-release-please-version
