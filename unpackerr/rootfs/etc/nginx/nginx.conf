# nginx here serves one thing: ingress, on 8099, handed to Unpackerr on 5656.
# Everything else on Home Assistant's network reaches Unpackerr on 5656
# directly, as it always has.
#
# Unpackerr's pages load their own files by relative address, but address its
# API and live updates from a URL base, which they read from a cookie Unpackerr
# sets when it serves the page. Unpackerr runs with no URL base, so that
# Traefik, Prometheus and anything else calling it on 5656 need none. Under
# ingress, nginx hands the page the ingress path in that cookie instead, and
# keeps Unpackerr's cookies under the path. Supervisor takes the path off every
# ingress request before it arrives here, so nothing else needs rewriting.
daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Unpackerr sends its urlbase cookie with the page alone. nginx sends a
    # second one beside it, naming the ingress path, which Supervisor gives in
    # X-Ingress-Path on every request. The browser keeps the later of two
    # cookies with the same name and path, so the page reads this one.
    map $upstream_cookie_urlbase $ingress_urlbase_cookie {
        default '';
        '~.' 'urlbase=$http_x_ingress_path/; Path=$http_x_ingress_path/; SameSite=Lax';
    }

    server {
        listen 8099 default_server;

        # Supervisor is the only caller ingress has, and the image's health
        # check the only other one.
        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;

        # Unpackerr's own websocket check compares the page's Origin with the
        # Host it was sent, and both name Home Assistant's address under
        # ingress.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Unpackerr believes X-Forwarded-For only from the networks listed
        # under Upstreams, and none is, so this only fills its HTTP log.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Queue progress and the log viewer follow a websocket for as long as
        # the page is open.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Unpackerr sets its cookies on the root, which under ingress is Home
        # Assistant's, shared by every ingress application. Its session cookie
        # is called session, as Bazarr's and Bazarr+'s are, so each is kept
        # under the ingress path instead.
        proxy_cookie_path ~^/$ $http_x_ingress_path/;
        add_header Set-Cookie $ingress_urlbase_cookie;

        location / {
            proxy_pass http://127.0.0.1:5656;
        }
    }
}
