arch:
  - aarch64
  - amd64
# Wallos keeps everything in SQLite, and a hot backup could copy the database
# mid-write.
backup: cold
description:
  Tracks your subscriptions, what each costs a month and when it renews,
  totalled in one currency. Wallos sends a notification before each payment, by
  email, push or webhook.
image: 'ghcr.io/kanso-labs/home-assistant-application-wallos'
init: false
name: Wallos
ports:
  80/tcp: 8282
# The Configuration tab lists the options in the order the schema declares
# them, so they follow the order a person fills them in: the provider, then the
# addresses it is reached at, then how Wallos treats the people it signs in.
schema:
  oidc_enabled: bool?
  oidc_provider_name: str?
  oidc_client_id: str?
  oidc_client_secret: password?
  oidc_issuer: url?
  oidc_auth_url: url?
  oidc_token_url: url?
  oidc_userinfo_url: url?
  oidc_redirect_url: url?
  oidc_scopes: str?
  oidc_auto_create_user: bool?
  oidc_require_email_verified: bool?
  oidc_disable_password_login: bool?
  ssrf_allowlist: str?
slug: wallos
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/wallos'
version: '0.2.0' # x-release-please-version
webui: 'http://[HOST]:[PORT:80]'
