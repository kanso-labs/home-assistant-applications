arch:
  - aarch64
  - amd64
# Wallos keeps everything in SQLite, and a hot backup could copy the database
# mid-write.
backup: cold
description:
  Tracks your subscriptions, what each costs a month and when it renews,
  totalled in one currency. Wallos sends a notification before each payment, by
  email, push or webhook.
image: 'ghcr.io/kanso-labs/home-assistant-application-wallos'
# Wallos builds every address relative to the page, so ingress reaches
# upstream's own nginx on port 80 with no URL base and nothing in front of it.
ingress: true
ingress_port: 80
# Supervisor reads a request through ingress whole and refuses one over 16 MiB,
# unless it is streamed. A Wallos backup restored through it carries the logos,
# and upstream lifts its own limits to 256 MiB for that reason.
ingress_stream: true
init: false
name: Wallos
options:
  hosts: []
panel_icon: 'mdi:credit-card-clock-outline'
ports:
  80/tcp: 8282
# The Configuration tab lists the options, and the fields of each host entry,
# in the order the schema declares them, so they follow the order a person
# fills them in: the provider, then the addresses it is reached at, then how
# Wallos treats the people it signs in, and last the names and addresses on
# your own network Wallos may reach.
schema:
  oidc_enabled: bool?
  oidc_provider_name: str?
  oidc_client_id: str?
  oidc_client_secret: password?
  oidc_issuer: url?
  oidc_auth_url: url?
  oidc_token_url: url?
  oidc_userinfo_url: url?
  oidc_redirect_url: url?
  oidc_scopes: str?
  oidc_auto_create_user: bool?
  oidc_require_email_verified: bool?
  oidc_disable_password_login: bool?
  hosts:
    - name: match(^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*$)
      address: match(^([0-9]{1,3}(\.[0-9]{1,3}){3}|[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*)$)
  ssrf_allowlist: str?
slug: wallos
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/wallos'
version: '0.6.2' # x-release-please-version
