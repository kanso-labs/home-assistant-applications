arch:
  - aarch64
  - amd64
backup: cold
description:
  Indexer proxy for the arr stack and other clients. Jackett translates a search
  into each tracker's own query format, and hands the results back in one shape
  that Radarr, Sonarr and the rest understand.
image: 'ghcr.io/kanso-labs/home-assistant-application-jackett'
init: false
map:
  # Supervisor deprecated `addon_config` for `app_config` in 2026.07, but
  # frenck/action-addon-linter still only accepts the older spelling and has
  # had no release since 2025-11. Home Assistant's own apps-example runs the
  # same linter. Switch this once the linter's schema catches up.
  - read_only: false
    type: addon_config
name: Jackett
ports:
  9117/tcp: 9117
ports_description:
  9117/tcp: Web interface and API
slug: jackett
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/jackett'
version: '1.0.0' # x-release-please-version
webui: 'http://[HOST]:[PORT:9117]'
