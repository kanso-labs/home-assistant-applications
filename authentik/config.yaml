arch:
  - aarch64
  - amd64
backup: cold
description:
  Self-hosted identity provider for single sign-on. Authentik puts OAuth2, OIDC,
  SAML, LDAP and proxy authentication in front of the applications you run, with
  one set of users and one login.
image: 'ghcr.io/kanso-labs/home-assistant-application-authentik'
# nginx answers ingress on a port of its own, see DOCS.md. 9000 and 9443 are
# Authentik itself, as before.
ingress: true
ingress_port: 9001
init: false
map:
  # Read/write, and nothing else. This holds the drop-in directories a user
  # fills by hand — custom email templates and certificates. The database, the
  # media uploads and the secret key are private state and live in /data, which
  # Home Assistant already backs up without being mapped. Blueprints stay inside
  # the image: they are what the default flows are built from, so an empty
  # mapped directory would mean a fresh install with no login flow at all.
  #
  # Note what is deliberately absent: the media map type. Authentik uses
  # /media for its own icon and background uploads, so mapping the Home
  # Assistant media library there would mount a film collection on top of it.
  - read_only: false
    type: app_config
name: Authentik
options:
  # bootstrap_email has no default on purpose. Supervisor checks a default
  # against its type, and an empty string is not an email address, so an
  # install that left the field blank refused to start.
  bootstrap_password: ''
  cookie_domain: ''
  log_level: info
panel_icon: 'mdi:shield-account'
ports:
  9000/tcp: 9000
  9443/tcp: 9443
schema:
  bootstrap_email: email?
  bootstrap_password: password?
  cookie_domain: str?
  log_level: list(trace|debug|info|warning|error)
slug: authentik
# How long Supervisor lets the application stop before Docker kills it, in
# seconds, up from its default of 10. Authentik's server and worker stop first,
# which took close to 30 seconds when this was tried, and then PostgreSQL,
# which writes its shutdown checkpoint. A database killed partway loses
# nothing, but its next start replays the log first.
timeout: 120
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/authentik'
version: '1.0.3' # x-release-please-version
