# nginx here serves one thing: Authentik to ingress, on 9001. The published
# ports, 9000 and 9443, are Authentik itself with nothing in front of them, so
# Traefik, the embedded outpost and every OIDC client reach it exactly as they
# did before ingress, and the issuer URLs Authentik signs into its tokens keep
# naming the address those clients use.
#
# Ingress serves Authentik under a path Supervisor chooses and strips before a
# request arrives here. Authentik writes one base into its pages, and its
# scripts build the API, the websocket and most links from it, so this writes
# the path into that base, into redirects and into cookie paths. A handful of
# addresses Authentik writes out whole are rewritten too, each in the one place
# it appears, and the Dockerfile fails the build if one of those in its scripts
# or its page template goes missing.
#
# Authentik's own AUTHENTIK_WEB__PATH would set a base at the source instead,
# and is not used because it moves every route, the published port's included:
# the issuer of every OIDC provider would then carry the ingress path, and it is
# signed into each token, where no proxy can take it out again.

# Debian builds nginx with no user of its own, and its temporary directories
# belong to www-data.
user www-data;
daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Supervisor names the path in X-Ingress-Path. It lands inside the page, so
    # only a value of the shape Supervisor sends is used, and any other request
    # is served at the root, as the published port serves it.
    map $http_x_ingress_path $base_path {
        default '';
        '~^/api/hassio_ingress/[A-Za-z0-9_-]+$' $http_x_ingress_path;
    }

    # The address the browser asked for. Home Assistant passes the Host it was
    # reached by and adds X-Forwarded-Host, which behind a reverse proxy is the
    # proxy's public name instead. Authentik prefers X-Forwarded-Host from a
    # proxy it trusts and Django reads Host, so both are given this one value,
    # and the base Authentik writes into the page is the one rewritten below.
    map $http_x_forwarded_host $public_host {
        default $http_host;
        '~^\s*(?<first_host>[^,\s]+)' $first_host;
    }

    # The same without its port, for a cookie's domain.
    map $public_host $public_hostname {
        default $public_host;
        '~^(?<bare_host>\[[^]]+\]|[^:]+)' $bare_host;
    }

    # Authentik builds the page's base and checks the Origin of every change
    # against the scheme it is told, and the browser's page is https whenever
    # Home Assistant's is.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }

    server {
        listen 9001 default_server;

        # Supervisor is the only caller ingress has, and this port is not
        # published. It writes the path a request names into the page, so it
        # answers no one else; anything else on Home Assistant's network has the
        # published port, which serves the same Authentik at the root.
        allow 172.30.32.2;
        deny all;

        # The maps above match regular expressions, and evaluating one replaces
        # the captures of proxy_redirect's own patterns below. Reading the path
        # once here, before any of those run, keeps them apart.
        set $ingress_path $base_path;

        absolute_redirect off;
        # Authentik limits its own uploads, such as icons and flow backgrounds.
        client_max_body_size 0;

        proxy_http_version 1.1;
        proxy_set_header Host $public_host;
        proxy_set_header X-Forwarded-Host $public_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # sub_filter cannot read a compressed response, so Authentik is asked
        # for none. Supervisor asks for compression on every request and undoes
        # it before passing a response on, so the only hop this leaves
        # uncompressed is the one inside the machine.
        proxy_set_header Accept-Encoding '';
        # The admin and user interfaces hold a WebSocket open for as long as
        # they are.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Authentik forbids framing any page but the flow executor's, and
        # ingress is a frame inside Home Assistant, from Home Assistant's own
        # address.
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options SAMEORIGIN always;

        # Redirects name paths at the root, except a page to return to that the
        # browser built from its own address, which already carries the path.
        proxy_redirect ~^(?<under_ingress>/api/hassio_ingress/.*)$ $under_ingress;
        proxy_redirect ~^(?<at_root>/.*)$ $ingress_path$at_root;
        proxy_cookie_path / $ingress_path/;
        # With cookie_domain set, Authentik names the domain the published
        # address is under, which a browser on Home Assistant's address refuses.
        proxy_cookie_domain ~.+ $public_hostname;

        sub_filter_once off;

        location ^~ /static/ {
            proxy_pass http://127.0.0.1:9000;

            # Two addresses the interfaces' scripts send the browser to without
            # Authentik's base, which the Dockerfile checks the built scripts
            # still hold, and the default logo and backgrounds.
            sub_filter_types application/javascript text/javascript;
            sub_filter '"/flows/-/default/authentication/"' '"$ingress_path/flows/-/default/authentication/"';
            sub_filter 'window.location.assign("/if/user/")' 'window.location.assign("$ingress_path/if/user/")';
            sub_filter '"/static/' '"$ingress_path/static/';
        }

        # Where a flow sends the browser next, and where its cancel link leads.
        # The flow executor answers with a space after each colon. A page to
        # return to built from the browser's address already carries the path,
        # and nginx tries the longer string first where both match.
        location ^~ /api/v3/flows/executor/ {
            proxy_pass http://127.0.0.1:9000;

            sub_filter_types application/json;
            sub_filter '"to": "/api/hassio_ingress/' '"to": "/api/hassio_ingress/';
            sub_filter '"to": "/' '"to": "$ingress_path/';
            sub_filter '"cancel_url": "/' '"cancel_url": "$ingress_path/';
            sub_filter '"/static/' '"$ingress_path/static/';
            sub_filter '"/files/' '"$ingress_path/files/';
        }

        # The brand's logo and icon. The interfaces only read this answer, and
        # the admin interface edits a brand at an address of its own, which is
        # not rewritten. Elsewhere in the API only fields that are never saved
        # are rewritten, each named by its key: the admin interface saves what
        # it reads, and saving a rewritten address would store the ingress
        # path for the published port as well.
        location = /api/v3/core/brands/current/ {
            proxy_pass http://127.0.0.1:9000;

            sub_filter_types application/json;
            sub_filter '"/static/' '"$ingress_path/static/';
            sub_filter '"/files/' '"$ingress_path/files/';
        }

        # Application icons, on the user's library and the admin interface's
        # list. Authentik writes each icon's address into read-only fields
        # beside meta_icon, the one it is saved in, which can hold a /static/
        # path of its own and is what the admin interface sends back on a save.
        # So the read-only fields are named by their key, and nothing else is
        # matched. The core API answers with no space after a colon. light and
        # dark are the keys of meta_icon_themed_urls, the only object here that
        # has them.
        location ^~ /api/v3/core/applications/ {
            proxy_pass http://127.0.0.1:9000;

            sub_filter_types application/json;
            sub_filter '"meta_icon_url":"/' '"meta_icon_url":"$ingress_path/';
            sub_filter '"light":"/' '"light":"$ingress_path/';
            sub_filter '"dark":"/' '"dark":"$ingress_path/';
        }

        # Source icons, on the user's settings and the admin interface's list,
        # the same way: icon is saved, and icon_url and icon_themed_urls are
        # read only. The login page's come through the flow executor above.
        location ^~ /api/v3/sources/ {
            proxy_pass http://127.0.0.1:9000;

            sub_filter_types application/json;
            sub_filter '"icon_url":"/' '"icon_url":"$ingress_path/';
            sub_filter '"light":"/' '"light":"$ingress_path/';
            sub_filter '"dark":"/' '"dark":"$ingress_path/';
        }

        # The icons of the kinds of provider and connector the admin interface
        # offers to create, in its wizards. These answers only list kinds, and
        # icon_url is read only. The sources' list is under the location above.
        location ~ ^/api/v3/[a-z_/]+/types/$ {
            proxy_pass http://127.0.0.1:9000;

            sub_filter_types application/json;
            sub_filter '"icon_url":"/' '"icon_url":"$ingress_path/';
        }

        # The Open link on the admin interface's Files page. Authentik builds
        # it whole from the request, so it names the host and not the path.
        # Files are uploaded rather than saved from this answer, and name, the
        # field the icon pickers save, is left alone.
        location = /api/v3/admin/file/ {
            proxy_pass http://127.0.0.1:9000;

            sub_filter_types application/json;
            sub_filter '"url":"http://$public_host/' '"url":"http://$public_host$ingress_path/';
            sub_filter '"url":"https://$public_host/' '"url":"https://$public_host$ingress_path/';
        }

        location / {
            proxy_pass http://127.0.0.1:9000;

            # Pages. Authentik writes its base twice in header_js.html, whole
            # and as a path, and the brand into the same script, where escapejs
            # writes each quote as \u0022.
            sub_filter '://$public_host/' '://$public_host$ingress_path/';
            sub_filter 'relBase: "/"' 'relBase: "$ingress_path/"';
            sub_filter '"/static/' '"$ingress_path/static/';
            sub_filter '\u0022/static/' '\u0022$ingress_path/static/';
            sub_filter '"/files/' '"$ingress_path/files/';
            sub_filter '\u0022/files/' '\u0022$ingress_path/files/';
        }
    }
}
