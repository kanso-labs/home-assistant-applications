configuration:
  enable_authentication:
    description: >-
      Require a Profilarr username and password. Leave it on unless you are
      certain nobody else can reach port 6868, because that port is published on
      your network and Home Assistant's own login does not cover it.
    name: Require a login
  external_url:
    description: >-
      The public address of this application when a reverse proxy is in front of
      it, such as https://profilarr.example.com. Behind a proxy, signing in can
      fail with 403 until this is set. Once it is, sign in at that address
      rather than on port 6868. Leave it empty if you open Profilarr on its
      port.
    name: External address
  parser_host:
    description: >-
      Hostname of a Profilarr parser service, which the custom format and
      quality profile testing pages need. This application does not include one.
      Leave it empty unless you run the parser elsewhere.
    name: Parser host
  parser_port:
    description: The port the parser answers on. Ignored when no host is set.
    name: Parser port
network:
  6868/tcp: The port the Profilarr web interface listens on.
