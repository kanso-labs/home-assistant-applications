# nginx here serves one thing: Profilarr to ingress, on 6869. The published
# port, 6868, is Profilarr itself with nothing in front of it, so Traefik and
# anything calling Profilarr's API reach it exactly as they did before ingress.
#
# Ingress serves Profilarr under a path Supervisor chooses,
# /api/hassio_ingress/<token>, and strips it before a request arrives here.
# Profilarr has no setting for a base path, and writes root addresses, "/arr"
# or "/api/v1/...", all through its pages and scripts. SvelteKit, which it is
# built on, already works out its own base from the page's address, so what
# needs the path is everything Profilarr wrote by hand:
#
# - Pages: the root addresses in the HTML are given the path below, and
#   ingress-shim.js is loaded first, which gives the path to every address the
#   page asks for afterwards. See that file.
# - Redirects and the session cookie are given the path here as well.
#
# Nothing else is rewritten, so Profilarr's API answers exactly as it does on
# the published port.

user nginx;
daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    include /etc/nginx/mime.types;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Supervisor names the path in X-Ingress-Path. It lands inside the page, so
    # only a value of the shape Supervisor sends is used, and any other request
    # is served at the root, as the published port serves it.
    map $http_x_ingress_path $base_path {
        default '';
        '~^/api/hassio_ingress/[A-Za-z0-9_-]+$' $http_x_ingress_path;
    }

    # SvelteKit refuses a form posted from an address other than the one it
    # takes the request to have arrived at, and that includes the login. Behind
    # Home Assistant on https the browser names https://<host>, while Profilarr
    # sees http://<host>, or the external_url option when that is set. An
    # Origin naming the host the request came to is therefore replaced with the
    # one Profilarr expects, which the nginx service writes into
    # /run/nginx/origin.conf at start. Any other Origin passes through, for
    # Profilarr to refuse as it always would.
    include /run/nginx/origin.conf;

    map "$http_origin|$http_host" $upstream_origin {
        default $http_origin;
        '~^https?://([^|]+)\|\1$' $profilarr_origin;
    }

    server {
        listen 6869 default_server;

        # Supervisor is the only caller ingress has, and this port is not
        # published. It writes the path a request names into the page, so it
        # answers no one else; anything else on Home Assistant's network has the
        # published port, which serves the same Profilarr at the root.
        allow 172.30.32.2;
        deny all;

        # A Location of /auth/login would send the frame to Home Assistant's
        # own root. absolute_redirect off keeps nginx from adding its own host
        # and port, which the browser cannot reach.
        absolute_redirect off;
        proxy_redirect ~^/(?<redirect_path>.*)$ $base_path/$redirect_path;
        # Profilarr's cookies are set for the whole site, which here is Home
        # Assistant's. Kept to the ingress path, they reach no other
        # application, and Home Assistant never sees them.
        proxy_cookie_path / $base_path/;

        # Backups are restored by uploading them, which ingress streams in;
        # see ingress_stream in config.yaml.
        client_max_body_size 0;
        proxy_request_buffering off;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $upstream_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # sub_filter cannot read a compressed page, so Profilarr is asked for
        # none. Supervisor asks for compression on every request and undoes it
        # before passing a response on, so the only hop this leaves
        # uncompressed is the one inside the machine.
        proxy_set_header Accept-Encoding '';
        # Sync progress streams over server-sent events for as long as the page
        # is open.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # The script that carries the path into the page, served from here
        # rather than by Profilarr, under a name none of its routes uses.
        location = /_ingress/shim.js {
            alias /etc/nginx/ingress-shim.js;
            default_type text/javascript;
        }

        location / {
            proxy_pass http://127.0.0.1:6868;
            sub_filter_once off;
            # Loaded ahead of everything else in the page, so that it is in
            # place before Profilarr's own scripts ask for anything.
            sub_filter '<head>' '<head><script src="$base_path/_ingress/shim.js"></script>';
            # The root addresses in the HTML itself, which the browser asks for
            # while it reads the page, before any script runs. SvelteKit writes
            # its own scripts and styles as "../_app/…", which need nothing.
            sub_filter 'href="/' 'href="$base_path/';
            sub_filter 'src="/' 'src="$base_path/';
            sub_filter 'action="/' 'action="$base_path/';
        }

        # Profilarr's scripts. One check in them is rewritten: the root layout
        # hides the sidebar on the sign-in pages by asking whether the address
        # starts with /auth/, which under ingress it never does. The Dockerfile
        # fails the build if the text below goes missing from an update.
        location /_app/immutable/nodes/ {
            proxy_pass http://127.0.0.1:6868;
            sub_filter_once off;
            sub_filter_types text/javascript application/javascript;
            sub_filter 'url.pathname.startsWith(`/auth/`)' 'url.pathname.startsWith(`$base_path/auth/`)';
        }
    }
}
