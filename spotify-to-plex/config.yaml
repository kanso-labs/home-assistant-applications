arch:
  - aarch64
  - amd64
backup: cold
description:
  Keeps Spotify playlists synced with a Plex music library. Spotify to Plex
  matches each track against what Plex already has, and can hand the rest to
  Lidarr, Slskd or Tidal.
image: 'ghcr.io/kanso-labs/home-assistant-application-spotify-to-plex'
init: false
map:
  # Supervisor deprecated `addon_config` for `app_config` in 2026.07, but
  # frenck/action-addon-linter still only accepts the older spelling and has
  # had no release since 2025-11. Home Assistant's own apps-example runs the
  # same linter. Switch this once the linter's schema catches up.
  - read_only: false
    type: addon_config
name: Spotify to Plex
options:
  redirect_uri: ''
  spotify_client_id: ''
  spotify_client_secret: ''
ports:
  9030/tcp: 9030
ports_description:
  9030/tcp: Web interface
schema:
  redirect_uri: url?
  spotify_client_id: str?
  spotify_client_secret: password?
slug: spotify-to-plex
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/spotify-to-plex'
version: '1.1.0' # x-release-please-version
webui: 'http://[HOST]:[PORT:9030]'
