configuration:
  redirect_uri:
    description: >-
      Para onde o Spotify redireciona o navegador após o login. Deixe vazio, a
      menos que você mesmo hospede a página de redirecionamento, e registre no
      Spotify o endereço que estiver aqui.
    name: URI de redirecionamento
  spotify_client_id:
    description: >-
      O client id do aplicativo Spotify que você criou em developer.spotify.com.
      Sem ele não é possível acessar o Spotify.
    name: Client id do Spotify
  spotify_client_secret:
    description: >-
      O client secret desse mesmo aplicativo Spotify.
    name: Client secret do Spotify
network:
  9030/tcp: A porta em que a interface web escuta.
