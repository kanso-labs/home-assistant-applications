configuration:
  browser_locale:
    description: >-
      O idioma que o navegador apresenta aos sites, como uma etiqueta do tipo
      en-US ou pt-BR. Deixe vazio para manter a configuração da própria imagem,
      C.UTF-8, que não indica idioma nenhum.
    name: Idioma do navegador
  log_level:
    description: >-
      Quanto o FlareSolverr escreve no log. Aumente para debug quando um desafio
      estiver falhando e você precisar ver o que o navegador fez.
    name: Nível de log
  proxy_password:
    description: >-
      A senha do proxy, se ele pedir uma. O FlareSolverr a escreve no log a cada
      requisição, a menos que o nível de log seja warning ou error.
    name: Senha do proxy
  proxy_server:
    description: >-
      Um proxy pelo qual o navegador envia todas as requisições, no formato
      protocolo://host:porta, como http://proxy.local:3128 ou
      socks5://proxy.local:1080. Os desafios passam com mais facilidade a partir
      de um endereço em que o site confia. Deixe vazio para conectar
      diretamente.
    name: Servidor proxy
  proxy_username:
    description: O nome de usuário do proxy, se ele pedir um.
    name: Usuário do proxy
network:
  8191/tcp: >-
    Só para um Prowlarr fora do Home Assistant. Um Prowlarr dentro dele acessa o
    FlareSolverr em http://2dd33fbd-flaresolverr:8191 sem abrir porta nenhuma.
    Quem consegue acessar esta porta pode fazer o FlareSolverr buscar páginas de
    dentro da rede do Home Assistant.
