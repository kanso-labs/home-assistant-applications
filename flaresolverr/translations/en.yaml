configuration:
  browser_locale:
    description: >-
      The language the browser presents to websites, as a tag such as en-US or
      pt-BR. Leave it empty to keep the image's own setting, C.UTF-8, which
      names no language.
    name: Browser language
  log_level:
    description: >-
      How much FlareSolverr writes to the log. Raise it to debug when a
      challenge is failing and you need to see what the browser did.
    name: Log level
  proxy_password:
    description: >-
      The password for the proxy, if it asks for one. FlareSolverr writes it to
      the log with every request unless the log level is warning or error.
    name: Proxy password
  proxy_server:
    description: >-
      A proxy for the browser to send every request through, as
      protocol://host:port, such as http://proxy.local:3128 or
      socks5://proxy.local:1080. Challenges are more likely to pass from an
      address the site trusts. Leave it empty to connect directly.
    name: Proxy server
  proxy_username:
    description: The user name for the proxy, if it asks for one.
    name: Proxy user name
network:
  8191/tcp: >-
    Only for a Prowlarr outside Home Assistant. One inside it reaches
    FlareSolverr at http://2dd33fbd-flaresolverr:8191 with no port opened.
    Anyone who can reach this port can have FlareSolverr fetch pages from inside
    Home Assistant's network.
