arch:
  - aarch64
  - amd64
description:
  Publishes extra .local names and Bonjour services on your network with Avahi.
  Give an application a name of its own, such as sonarr.local, or announce a
  service for a device that does not announce its own.
# mDNS is multicast on the local network, which a published port cannot carry.
# Avahi has to sit on the host's own interfaces to be heard at all.
host_network: true
image: 'ghcr.io/kanso-labs/home-assistant-application-avahi-publisher'
init: false
name: Avahi Publisher
options:
  aliases: []
  publish_aliases: true
  publish_services: true
  services: []
# The options, and the fields of each alias and service, are in the order the
# Configuration tab shows them, which is why they are not alphabetical.
schema:
  publish_aliases: bool
  aliases:
    - name: match(^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*$)
      address: match(^([0-9]{1,3}(\.[0-9]{1,3}){3}|[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*)$)?
      enabled: bool?
  publish_services: bool
  services:
    - name: str
      type: match(^_[A-Za-z0-9-]+\._(tcp|udp)$)
      port: port
      host: match(^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*$)?
      txt:
        - str?
      enabled: bool?
  interfaces: match(^[A-Za-z0-9_.:-]+(,[A-Za-z0-9_.:-]+)*$)?
slug: avahi-publisher
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/avahi-publisher'
version: '0.2.0' # x-release-please-version
