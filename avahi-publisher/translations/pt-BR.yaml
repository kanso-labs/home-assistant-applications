configuration:
  aliases:
    description: >-
      Nomes .local extras. Um apelido sem endereço aponta para este host.
    fields:
      address:
        description: >-
          O endereço IPv4 ou IPv6 para o qual o nome aponta. Deixe vazio para
          apontar para este host.
        name: Endereço
      enabled:
        description: >-
          Desligue para parar de publicar este apelido sem apagá-lo. Um apelido
          novo aparece com isto desligado, mas é publicado até você desligar por
          conta própria.
        name: Ativado
      name:
        description: >-
          O nome a publicar, sem .local. sonarr vira sonarr.local.
        name: Nome
    name: Apelidos
  interfaces:
    description: >-
      As interfaces de rede em que publicar, separadas por vírgulas. Deixe vazio
      para usar aquela pela qual este host alcança a rede.
    name: Interfaces
  publish_aliases:
    description: Publica os apelidos. Desligue para retirar todos de uma vez.
    name: Publicar apelidos
  publish_services:
    description: Publica os serviços. Desligue para retirar todos de uma vez.
    name: Publicar serviços
  services:
    description: >-
      Serviços Bonjour a anunciar, para que apareçam nos aplicativos que
      exploram a rede.
    fields:
      enabled:
        description: >-
          Desligue para parar de publicar este serviço sem apagá-lo. Um serviço
          novo aparece com isto desligado, mas é publicado até você desligar por
          conta própria.
        name: Ativado
      host:
        description: >-
          O dispositivo que oferece o serviço, sem .local. Deixe vazio para este
          host.
        name: Host
      name:
        description: >-
          O que os aplicativos que exploram a rede mostram, como NAS do
          Escritório.
        name: Nome
      port:
        description: A porta em que o serviço responde.
        name: Porta
      txt:
        description: Registros chave=valor opcionais, como path=/admin.
        name: Registros TXT
      type:
        description: >-
          O tipo de serviço DNS-SD, como _smb._tcp para compartilhamento de
          arquivos ou _http._tcp para uma página web.
        name: Tipo
    name: Serviços
