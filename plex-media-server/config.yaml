arch:
  - aarch64
  - amd64
backup: cold
backup_exclude:
  - '**/Plex Media Server/Cache/**'
  - '**/Plex Media Server/Crash Reports/**'
  - '**/Plex Media Server/Diagnostics/**'
  - '**/Plex Media Server/Logs/**'
  - '**/Plex Media Server/Media/**'
  - '**/Plex Media Server/Metadata/**'
  - '**/Plex Media Server/Plug-in Support/Caches/**'
description:
  Recorded media, live TV, online news, and podcasts ready to stream. Plex Media
  Server organises what you already have and serves it to the Plex apps.
devices:
  - /dev/dri
  - /dev/dri/card0
  - /dev/dri/card1
  - /dev/dri/renderD128
hassio_api: true
image: 'ghcr.io/kanso-labs/home-assistant-application-plex-media-server'
init: false
map:
  - read_only: false
    type: app_config
  - read_only: false
    type: media
  - read_only: true
    type: share
name: Plex Media Server
options:
  advertise_addresses: []
  allowed_networks: []
  claim_code: ''
ports:
  3005/tcp: 3005
  32400/tcp: 32400
  32410/udp: 32410
  32412/udp: 32412
  32413/udp: 32413
  32414/udp: 32414
  32469/tcp: 32469
  8324/tcp: 8324
ports_description:
  3005/tcp: Plex Companion, for controlling playback from another device
  32400/tcp: Web interface and API
  32410/udp: Discovery on the local network
  32412/udp: Discovery on the local network
  32413/udp: Discovery on the local network
  32414/udp: Discovery on the local network
  32469/tcp: DLNA server
  8324/tcp: Plex Companion, on the separate port Plex for Roku uses
schema:
  advertise_addresses:
    - str
  allowed_networks:
    - str
  claim_code: str?
slug: plex-media-server
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/plex-media-server'
version: '1.4.1' # x-release-please-version
webui: 'http://[HOST]:[PORT:32400]/web'
