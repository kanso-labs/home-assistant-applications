configuration:
  advertise_addresses:
    description: >-
      Endereços que os aplicativos devem usar para alcançar este servidor, como
      http://192.168.1.10:32400. Defina quando um aplicativo encontra o servidor
      e navega por ele, mas não consegue reproduzir.
    name: Endereços divulgados
  allowed_networks:
    description: >-
      Redes que o Plex atende sem exigir login, como 192.168.1.0/24. Deixe vazio
      a menos que esteja usando o servidor sem uma conta Plex. Acesse-o pelo
      endereço, e não pelo nome, quando usar esta opção.
    name: Redes permitidas
  claim_code:
    description: >-
      Um código de vinculação de plex.tv/claim, usado uma única vez na primeira
      execução para associar este servidor à sua conta. O código expira quatro
      minutos após ser gerado.
    name: Código de vinculação
network:
  32400/tcp: A porta em que a interface web e a API do Plex escutam.
  32410/udp: Descoberta na rede local.
  32412/udp: Descoberta na rede local.
  32413/udp: Descoberta na rede local.
  32414/udp: Descoberta na rede local.
  32469/tcp: A porta em que o servidor DLNA escuta.
  8324/tcp: Plex Companion, para controlar a reprodução de outro dispositivo.
