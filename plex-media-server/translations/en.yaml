configuration:
  allowed_networks:
    description: >-
      Networks Plex answers without anyone signing in, such as 192.168.1.0/24.
      Leave this empty unless you are running the server without a Plex account.
      Reach it by address rather than by name when you use this.
    name: Allowed networks
  claim_code:
    description: >-
      A claim code from plex.tv/claim, used once on first start to link this
      server to your account. A code expires four minutes after it is issued.
    name: Claim code
network:
  32400/tcp: The port the Plex web interface and API listen on.
  32410/udp: Discovery on the local network.
  32412/udp: Discovery on the local network.
  32413/udp: Discovery on the local network.
  32414/udp: Discovery on the local network.
  32469/tcp: The port the DLNA server listens on.
  8324/tcp: Plex Companion, for controlling playback from another device.
