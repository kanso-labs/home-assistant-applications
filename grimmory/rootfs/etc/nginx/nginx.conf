# nginx here serves one thing: Grimmory to ingress, on 6061. The published port,
# 6060, is Grimmory itself with nothing in front of it, so Traefik, Kobo,
# KOReader and OPDS readers reach it exactly as they did before ingress.
#
# Grimmory has no setting for a URL base. Its page names the root in a <base>
# tag, which its router and its relative assets follow, but its scripts build
# the API's address, the live updates' and a few of their own from the root
# as well. Ingress serves it under a path Supervisor chooses and strips before a
# request arrives here, so this writes that path into each of those places and
# passes everything else through untouched.
#
# Each sub_filter below matches text in Grimmory's built web interface, inside
# /app/app.jar. The Dockerfile fails the build when any of them no longer
# appears there, which is what to look at when a Grimmory update breaks this.

# Alpine builds nginx to run its workers as nginx, the owner of its temporary
# directories.
user nginx;
daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Supervisor names the path in X-Ingress-Path. It lands inside the page and
    # its scripts, so only a value of the shape Supervisor sends is used, and
    # any other request is served at the root, as the published port serves it.
    map $http_x_ingress_path $base_path {
        default '';
        '~^/api/hassio_ingress/[A-Za-z0-9_-]+$' $http_x_ingress_path;
    }

    server {
        listen 6061 default_server;

        # Supervisor is the only caller ingress has, and this port is not
        # published. It writes the path a request names into the page, so it
        # answers no one else; anything else on Home Assistant's network has the
        # published port, which serves the same Grimmory at the root.
        allow 172.30.32.2;
        deny all;

        # Books are uploaded through here, and they can be large. config.yaml
        # has Supervisor stream them rather than refuse one over 16 MiB.
        client_max_body_size 0;
        proxy_request_buffering off;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # sub_filter cannot read a compressed page, so Grimmory is asked for
        # none. Supervisor asks for compression on every request and undoes it
        # before passing a response on, so the only hop this leaves
        # uncompressed is the one inside the machine.
        proxy_set_header Accept-Encoding '';
        # Live updates hold a WebSocket open for as long as the page is, and
        # audiobooks stream for as long as they play.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Grimmory's service worker caches the files ngsw.json lists, which
        # name them from the root, outside the ingress path. Refusing it here
        # leaves the page to load from the network, as it does on its first
        # visit anyway. The published port still has it.
        location = /ngsw-worker.js {
            return 404;
        }

        location / {
            proxy_pass http://127.0.0.1:6060;
            sub_filter_once off;
            sub_filter_types application/javascript text/javascript;
            # The page's base, which the router and every relative asset follow.
            sub_filter '<base href="/">' '<base href="$base_path/">';
            # The scripts' settings: the API's address, and the live updates'
            # over ws and wss.
            sub_filter 'BASE_URL:window.location.origin,' 'BASE_URL:window.location.origin+"$base_path",';
            sub_filter '.host}/ws`' '.host}$base_path/ws`';
            # Signing out, and a session running out, leave for the sign-in
            # page by a full page load rather than through the router.
            sub_filter 'redirectTo(`/login' 'redirectTo(`$base_path/login';
            # The readers load their scripts, their frame and the PDF engine
            # from /assets: three in the scripts, one in the PDF reader's frame.
            sub_filter '`/assets/' '`$base_path/assets/';
            sub_filter "from '/assets/" "from '$base_path/assets/";
        }
    }
}
