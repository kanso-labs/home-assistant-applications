arch:
  - aarch64
  - amd64
# The GeoIP database in /data is only a cache of a public download, which is
# fetched again when it is missing. Backing up 120 MB of it would buy nothing.
backup_exclude:
  - '*.mmdb'
description:
  Proxy server that gets past the anti-bot challenges standing between the arr
  applications and their indexers. It answers the same requests as FlareSolverr,
  with a hardened Firefox in place of Chrome.
image: 'ghcr.io/kanso-labs/home-assistant-application-byparr'
init: false
name: Byparr
options:
  log_level: info
# Closed by default. A Prowlarr on the same Home Assistant reaches Byparr by its
# internal name, and anything that can reach a published port can have the
# browser fetch pages from inside Home Assistant's network, see DOCS.md.
#
# That is also why there is no webui. Supervisor builds its link from the
# published port, and with none published the link would point at port None.
ports:
  8191/tcp: null
# The Configuration tab lists the options in the order the schema declares
# them, so they follow the order a person fills them in.
schema:
  log_level: list(error|warning|info|debug)
  proxy_server: url?
  proxy_username: str?
  proxy_password: password?
  browser_locale: match(^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$)?
slug: byparr
# The browser writes a fresh profile to /tmp for every request and deletes it
# afterwards, which on an SD card or eMMC is wear for nothing. This keeps /tmp
# in memory instead. Upstream now recommends a tmpfs too, mounted exec.
# Supervisor mounts this one noexec, which the browser does not mind, since
# nothing it runs is kept in /tmp.
tmpfs: true
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/byparr'
version: '2.0.0' # x-release-please-version
