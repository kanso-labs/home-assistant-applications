configuration:
  certfile:
    description: >-
      The certificate to serve over HTTPS, in Home Assistant's /ssl folder.
    name: Certificate file
  keyfile:
    description: The certificate's private key, in the same folder.
    name: Private key file
  log_level:
    description: How much detail Traefik writes to its log.
    name: Log level
  routes:
    description: >-
      The applications Traefik sends requests to, one route per host name.
    fields:
      host:
        description: >-
          The name requests arrive for, such as sonarr.home.local, with no
          http:// and no port.
        name: Host name
      middlewares:
        description: >-
          Middlewares to apply, in order, each defined in a file in this
          application's configuration folder, such as authentik.
        name: Middlewares
      url:
        description: >-
          Where the requests go, such as http://2dd33fbd-sonarr:8989 for another
          application or http://192.168.1.20:8080 for a device.
        name: Forward to
    name: Routes
  ssl:
    description: >-
      Also serve every route over HTTPS on port 443, with the certificate below.
    name: SSL
network:
  80/tcp: The port routes are served on over HTTP.
  443/tcp: The port routes are served on over HTTPS, when SSL is on.
