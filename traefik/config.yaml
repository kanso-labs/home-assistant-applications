arch:
  - aarch64
  - amd64
description:
  Reverse proxy that sends each request to the application its host name belongs
  to. Routes are set in the Configuration tab, and anything more in Traefik's
  own configuration files.
image: 'ghcr.io/kanso-labs/home-assistant-application-traefik'
ingress: true
ingress_entry: dashboard/
init: false
map:
  - read_only: false
    type: app_config
  - type: ssl
name: Traefik
options:
  certfile: fullchain.pem
  keyfile: privkey.pem
  log_level: info
  routes: []
  ssl: false
panel_icon: 'mdi:sign-direction'
ports:
  80/tcp: 80
  443/tcp: 443
# The options, and the fields of each route, are in the order the Configuration
# tab shows them, which is why they are not alphabetical.
schema:
  routes:
    - host: match(^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*$)
      url: url
      middlewares:
        - match(^[A-Za-z0-9][A-Za-z0-9_.@-]*$)?
  ssl: bool
  certfile: str
  keyfile: str
  log_level: list(trace|debug|info|warn|error|fatal|panic)
slug: traefik
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/traefik'
version: '0.1.0' # x-release-please-version
