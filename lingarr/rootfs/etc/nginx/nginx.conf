# nginx here serves one thing: Lingarr to ingress, on 9877. The published port,
# 9876, is Lingarr itself with nothing in front of it, so Traefik and Radarr's
# and Sonarr's webhooks reach it exactly as they did before ingress.
#
# Lingarr writes one base into its page, in a <base> tag, and its scripts build
# every address from it: the API, the router and the live updates. Ingress
# serves it under a path Supervisor chooses and strips before a request arrives
# here, so this writes that path into the tag and passes everything else
# through untouched.
#
# Lingarr's own BASE_PATH would set it at the source instead, and is not used
# because of what it does to the published port: the page there names the same
# base, so every address in the browser would carry the ingress path.

# Ubuntu builds nginx with no user of its own, and its temporary directories
# belong to www-data.
user www-data;
daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Supervisor names the path in X-Ingress-Path. It lands inside the page, so
    # only a value of the shape Supervisor sends is used, and any other request
    # is served at the root, as the published port serves it.
    map $http_x_ingress_path $base_path {
        default '';
        '~^/api/hassio_ingress/[A-Za-z0-9_-]+$' $http_x_ingress_path;
    }

    server {
        listen 9877 default_server;

        # Supervisor is the only caller ingress has, and this port is not
        # published. It writes the path a request names into the page, so it
        # answers no one else; anything else on Home Assistant's network has the
        # published port, which serves the same Lingarr at the root.
        allow 172.30.32.2;
        deny all;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # sub_filter cannot read a compressed page, so Lingarr is asked for
        # none. Supervisor asks for compression on every request and undoes it
        # before passing a response on, so the only hop this leaves
        # uncompressed is the one inside the machine.
        proxy_set_header Accept-Encoding '';
        # Live updates hold a WebSocket open for as long as the page is, and the
        # log page streams for as long as it is open.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        location / {
            proxy_pass http://127.0.0.1:9876;
            # The exact text Lingarr writes, in ApplicationBuilderExtensions.cs,
            # when it runs with no BASE_PATH. Should it ever change, ingress
            # shows a blank page while the published port keeps working, and
            # this line is what to look at.
            sub_filter '<base href="/">' '<base href="$base_path/">';
        }
    }
}
