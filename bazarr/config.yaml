arch:
  - aarch64
  - amd64
backup: cold
# What Bazarr rebuilds or regenerates on its own: its cache of provider
# responses and of the subtitles it extracts from media files, and its logs. The
# backups Bazarr takes itself, in backup, stay in.
backup_exclude:
  - cache
  - log
description:
  Subtitle manager for Radarr and Sonarr. Bazarr watches the libraries they
  manage, finds subtitles in the languages you ask for, and keeps them alongside
  the media.
image: 'ghcr.io/kanso-labs/home-assistant-application-bazarr'
# nginx answers on 6767 for ingress and the published port alike, see DOCS.md.
# Bazarr's only uploads are subtitle files, well inside the 16 MiB Supervisor
# reads whole of a request through ingress, so ingress_stream is left off.
ingress: true
ingress_port: 6767
init: false
map:
  - read_only: false
    type: app_config
  - read_only: false
    type: media
  - read_only: false
    type: share
name: Bazarr
panel_icon: 'mdi:subtitles-outline'
ports:
  6767/tcp: 6767
slug: bazarr
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/bazarr'
version: '1.2.5' # x-release-please-version
