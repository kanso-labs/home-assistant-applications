arch:
  - aarch64
  - amd64
backup: cold
description:
  Subtitle manager for Radarr and Sonarr. Bazarr watches the libraries they
  manage, finds subtitles in the languages you ask for, and keeps them alongside
  the media.
image: 'ghcr.io/kanso-labs/home-assistant-application-bazarr'
init: false
map:
  # Supervisor deprecated `addon_config` for `app_config` in 2026.07, but
  # frenck/action-addon-linter still only accepts the older spelling and has
  # had no release since 2025-11. Home Assistant's own apps-example runs the
  # same linter. Switch this once the linter's schema catches up.
  - read_only: false
    type: addon_config
  - read_only: false
    type: media
  - read_only: false
    type: share
name: Bazarr
ports:
  6767/tcp: 6767
slug: bazarr
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/bazarr'
version: '1.0.0' # x-release-please-version
webui: 'http://[HOST]:[PORT:6767]'
