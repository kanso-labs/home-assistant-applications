# nginx here serves one thing: ingress, on 8099, handed to qBittorrent on 8080.
# The published port reaches qBittorrent directly, as it always has.
#
# qBittorrent builds every address in its pages relatively, so it needs no URL
# base under ingress's path. Two other things stand in the way, and both are
# dealt with here rather than in qBittorrent's settings, which belong to the
# user and would change for the published port as well:
#
# - qBittorrent turns away a Host whose port is not the one it listens on, and
#   ingress arrives carrying Home Assistant's, homeassistant.local:8123.
# - Its pages take it for granted that they are the top window, and Home
#   Assistant shows ingress inside a frame of its own.
daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    # qBittorrent's CSRF check compares a request's Origin with X-Forwarded-Host
    # when there is one, and with Host otherwise. Home Assistant sets it to the
    # address the browser used, so it is passed on as it came, and stands in for
    # the Host replaced below when it is missing.
    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        '' $http_host;
    }

    server {
        listen 8099 default_server;

        # Supervisor is the only caller ingress has. qBittorrent sees every
        # request from here as coming from the loopback address, so anything
        # else on Home Assistant's network that reached this port would count as
        # local to it as well.
        allow 172.30.32.2;
        deny all;

        # A .torrent file is uploaded through here, and qBittorrent sets its own
        # limit on how large one can be.
        client_max_body_size 0;

        # qBittorrent's own address passes its Host check whatever "Server
        # domains" holds, and names the port it listens on.
        proxy_set_header Host 127.0.0.1:8080;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        # The page below is edited on its way through, which nginx cannot do to
        # a compressed one. Home Assistant drops this header already.
        proxy_set_header Accept-Encoding "";

        # The page every visit starts from. qBittorrent's scripts reach for
        # their own state through window.parent, which is the window itself
        # only while nothing frames it. Inside Home Assistant's frame it is Home
        # Assistant, and the interface stops drawing after the menu bar. Setting
        # it back to the page, before any of those scripts run, makes the frame
        # look like the top window to them. The frames qBittorrent opens inside
        # its own page keep pointing at that page, as they should.
        location = / {
            proxy_pass http://127.0.0.1:8080;
            sub_filter '<head>' '<head><script>window.parent = window;</script>';
            sub_filter_once on;
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
        }
    }
}
