arch:
  - aarch64
  - amd64
backup: cold
description:
  BitTorrent client with a web interface. qBittorrent downloads torrents into
  shared storage, where the rest of the stack can pick them up.
image: 'ghcr.io/kanso-labs/home-assistant-application-qbittorrent'
# nginx answers ingress on 8099, the default ingress_port, and hands it to
# qBittorrent, see DOCS.md.
ingress: true
init: false
map:
  - read_only: false
    type: app_config
  - read_only: false
    type: media
  - read_only: false
    type: share
name: qBittorrent
panel_icon: 'mdi:progress-download'
ports:
  6881/tcp: 6881
  6881/udp: 6881
  8080/tcp: 8080
slug: qbittorrent
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/qbittorrent'
version: '1.2.1' # x-release-please-version
