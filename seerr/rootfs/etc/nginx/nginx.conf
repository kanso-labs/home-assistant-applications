# nginx here serves one thing: Seerr to ingress, on 5056. The published port,
# 5055, is Seerr itself with nothing in front of it, so Traefik and anything
# calling Seerr's API reach it exactly as they did before ingress.
#
# Ingress serves Seerr under a path Supervisor chooses,
# /api/hassio_ingress/<token>, and strips it before a request arrives here.
# Seerr cannot be given a base path at all; its own documentation says so. It
# writes root addresses, "/discover" or "/api/v1/…", throughout its pages and
# scripts, so they are given the path in three places:
#
# - Pages: the root addresses in the HTML are given the path below, and
#   ingress-shim.js is loaded first, which gives the path to every address the
#   page asks for afterwards. See that file.
# - Scripts: Next.js loads the rest of Seerr's scripts and page data from
#   /_next/, from inside its own loader, before any page code runs. Only those
#   addresses are rewritten in the scripts, below.
# - Redirects and the session cookie are given the path here as well.
#
# The API is not rewritten, so nothing Seerr sends to the browser, and nothing
# the browser sends back to be stored, carries the ingress path.

user nginx;
daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    include /etc/nginx/mime.types;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Supervisor names the path in X-Ingress-Path. It lands inside the page, so
    # only a value of the shape Supervisor sends is used, and any other request
    # is served at the root, as the published port serves it.
    map $http_x_ingress_path $base_path {
        default '';
        '~^/api/hassio_ingress/[A-Za-z0-9_-]+$' $http_x_ingress_path;
    }

    server {
        listen 5056 default_server;

        # Supervisor is the only caller ingress has, and this port is not
        # published. It writes the path a request names into the page, so it
        # answers no one else; anything else on Home Assistant's network has the
        # published port, which serves the same Seerr at the root.
        allow 172.30.32.2;
        deny all;

        # Seerr sends a browser that is not signed in to /login, and one that
        # has not finished setting up to /setup, which would take the frame to
        # Home Assistant's own root. absolute_redirect off keeps nginx from
        # adding its own host and port, which the browser cannot reach.
        absolute_redirect off;
        proxy_redirect ~^/(?<redirect_path>.*)$ $base_path/$redirect_path;
        # Seerr's cookies are set for the whole site, which here is Home
        # Assistant's. Kept to the ingress path, they reach no other
        # application, and Home Assistant never sees them.
        proxy_cookie_path / $base_path/;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # sub_filter cannot read a compressed page, so Seerr is asked for none.
        # Supervisor asks for compression on every request and undoes it before
        # passing a response on, so the only hop this leaves uncompressed is
        # the one inside the machine.
        proxy_set_header Accept-Encoding '';
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # The script that carries the path into the page, served from here
        # rather than by Seerr, under a name none of its routes uses.
        location = /_ingress/shim.js {
            alias /etc/nginx/ingress-shim.js;
            default_type text/javascript;
        }

        # Seerr registers a service worker once someone signs in. Through
        # ingress that would be a worker on Home Assistant's own address, so
        # there is none: the shim refuses to register one, and this answers 404
        # in case anything asks all the same. Push notifications therefore work
        # on the published port only.
        location = /sw.js {
            return 404;
        }

        location / {
            proxy_pass http://127.0.0.1:5055;
            sub_filter_once off;
            # Loaded ahead of everything else in the page, so that it is in
            # place before Seerr's own scripts ask for anything.
            sub_filter '<head>' '<head><script src="$base_path/_ingress/shim.js"></script>';
            # The root addresses in the HTML itself, which the browser asks for
            # while it reads the page, before any script runs.
            sub_filter 'href="/' 'href="$base_path/';
            sub_filter 'src="/' 'src="$base_path/';
        }

        # Seerr's scripts, as Next.js builds them. Its loader names the folder
        # it loads scripts from as "/_next/", and tells one loaded script from
        # another by taking that folder off each one's address again, so the
        # folder has to carry the path where the loader writes it, not only
        # where the browser asks for it. The address of each page's data,
        # `/_next/data/…`, is built beside it. Both are given the path here,
        # and the Dockerfile fails the build if either goes missing from an
        # update.
        location /_next/static/ {
            proxy_pass http://127.0.0.1:5055;
            sub_filter_once off;
            sub_filter_types text/javascript application/javascript;
            sub_filter '"/_next/' '"$base_path/_next/';
            sub_filter '`/_next/' '`$base_path/_next/';
        }
    }
}
