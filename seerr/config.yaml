arch:
  - aarch64
  - amd64
backup: cold
description:
  Media request and discovery manager for Jellyfin, Plex and Emby. Seerr lets
  people ask for films and shows, then hands the approved requests to Radarr and
  Sonarr.
image: 'ghcr.io/kanso-labs/home-assistant-application-seerr'
init: false
map:
  # Supervisor deprecated `addon_config` for `app_config` in 2026.07, but
  # frenck/action-addon-linter still only accepts the older spelling and has
  # had no release since 2025-11. Home Assistant's own apps-example runs the
  # same linter. Switch this once the linter's schema catches up.
  - read_only: false
    type: addon_config
name: Seerr
ports:
  5055/tcp: 5055
ports_description:
  5055/tcp: Web interface
slug: seerr
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/seerr'
version: '1.1.1' # x-release-please-version
webui: 'http://[HOST]:[PORT:5055]'
