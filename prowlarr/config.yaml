arch:
  - aarch64
  - amd64
backup: cold
description:
  Indexer manager and proxy for the arr stack. Prowlarr keeps your indexer
  definitions in one place and pushes them out to Radarr, Sonarr and the rest,
  so each one does not have to be configured by hand.
image: 'ghcr.io/kanso-labs/home-assistant-application-prowlarr'
# nginx answers on 9696 for ingress and the published port alike, see DOCS.md.
ingress: true
ingress_port: 9696
init: false
map:
  - read_only: false
    type: app_config
name: Prowlarr
panel_icon: 'mdi:magnify'
options:
  ipv4_only: false
ports:
  9696/tcp: 9696
schema:
  ipv4_only: bool
slug: prowlarr
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/prowlarr'
version: '1.3.2' # x-release-please-version
