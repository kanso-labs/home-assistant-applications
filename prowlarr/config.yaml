arch:
  - aarch64
  - amd64
backup: cold
description:
  Indexer manager and proxy for the arr stack. Prowlarr keeps your indexer
  definitions in one place and pushes them out to Radarr, Sonarr and the rest,
  so each one does not have to be configured by hand.
image: 'ghcr.io/kanso-labs/home-assistant-application-prowlarr'
init: false
map:
  # Supervisor deprecated `addon_config` for `app_config` in 2026.07, but
  # frenck/action-addon-linter still only accepts the older spelling and has
  # had no release since 2025-11. Home Assistant's own apps-example runs the
  # same linter. Switch this once the linter's schema catches up.
  - read_only: false
    type: addon_config
name: Prowlarr
ports:
  9696/tcp: 9696
slug: prowlarr
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/prowlarr'
version: '1.0.0' # x-release-please-version
webui: 'http://[HOST]:[PORT:9696]'
