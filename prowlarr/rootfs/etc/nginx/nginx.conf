# nginx here serves one thing: Prowlarr, on 9696, for ingress and the published
# port alike. Prowlarr itself listens on the loopback address only.
daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    include /etc/nginx/servers/*.conf;
}
