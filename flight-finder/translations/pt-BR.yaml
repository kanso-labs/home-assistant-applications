configuration:
  access_password:
    description: >-
      A senha que todos digitam para abrir o Flight Finder, com pelo menos 12
      caracteres. A primeira inicialização cria o perfil de administrador com
      ela. Uma nova senha substitui a anterior na inicialização seguinte e
      desconecta todos, e uma troca feita dentro do Flight Finder é mantida até
      esta opção mudar.
    name: Senha compartilhada
  addresses:
    description: >-
      Endereços que levam ao Flight Finder além dos desta máquina, que ele já
      conhece, como https://voos.example.com por um proxy reverso. Informe
      apenas o esquema, o host e a porta. O primeiro em https passa a ser o
      endereço principal, para o qual os alertas apontam e no qual as passkeys
      funcionam.
    name: Outros endereços
  admin_profile:
    description: >-
      O nome do perfil de administrador que a primeira inicialização cria. Ele
      só é lido nesse momento, então mudá-lo depois não tem efeito.
    name: Perfil de administrador
network:
  3003/tcp: A porta em que a interface web do Flight Finder é servida.
