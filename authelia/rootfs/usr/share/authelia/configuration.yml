# yaml-language-server: $schema=https://www.authelia.com/schemas/v4.39/json-schema/configuration.json
#
# Authelia's configuration, written on first start and yours from then on.
#
# The domain and the sign-in address come from the application's Configuration
# tab: the values reading mustEnv "APP_DOMAIN" and mustEnv "APP_AUTHELIA_URL"
# are filled in from it every time the application starts. Replace one with a
# value of your own to stop it following the Configuration tab.
#
# This file is read as a template, so double curly braces mean something
# anywhere in it, these comments included.
#
# The secrets are not in this file. The application generated them into the
# secrets folder beside it and hands them to Authelia itself, so leave them out.
#
# Every option is documented at
# https://www.authelia.com/configuration/prologue/introduction/

server:
  address: 'tcp://:9091/'

log:
  level: 'info'

theme: 'auto'

authentication_backend:
  file:
    # The users, with their password hashes. Changes to it are picked up
    # without a restart.
    path: '/config/users_database.yml'
    watch: true

access_control:
  default_policy: 'deny'
  rules:
    # Everything under your domain needs a password. Change one_factor to
    # two_factor to ask for a one-time code or a passkey as well.
    - domain: '*.{{ mustEnv "APP_DOMAIN" }}'
      policy: 'one_factor'

session:
  cookies:
    # The domain Authelia signs people in for, and the address its sign-in
    # page is reached at through your reverse proxy.
    - domain: '{{ mustEnv "APP_DOMAIN" }}'
      authelia_url: '{{ mustEnv "APP_AUTHELIA_URL" }}'

storage:
  local:
    path: '/config/db.sqlite3'

notifier:
  # Password reset links and one-time codes are written to this file until
  # email is set up: https://www.authelia.com/configuration/notifications/smtp/
  filesystem:
    filename: '/config/notification.txt'
