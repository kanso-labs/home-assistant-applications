configuration:
  authelia_url:
    name: Endereço de login
    description: >-
      O endereço da página de login do Authelia, dentro do domínio. Deixe vazio
      para usar https://auth. seguido do domínio.
  domain:
    name: Domínio
    description: >-
      O domínio em que o Authelia faz o login das pessoas, como example.org ou
      home.local, sem https:// na frente. Ele precisa ter pelo menos um ponto,
      porque os navegadores não compartilham um login por um domínio de topo
      inteiro, como local. Toda aplicação que ele protege precisa estar dentro
      dele.
network:
  9091/tcp: >-
    A porta em que o Authelia escuta. Aponte seu proxy reverso para ela; o login
    só funciona no endereço de login.
