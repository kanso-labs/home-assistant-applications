# nginx here serves one thing: Questarr to ingress, on 5001. The published
# port, 5000, is Questarr itself with nothing in front of it, so a reverse proxy
# and anything calling Questarr's API reach it exactly as they would without
# ingress.
#
# Ingress serves Questarr under a path Supervisor chooses,
# /api/hassio_ingress/<token>, and strips it before a request arrives here.
# Questarr is built for a proxy that does that: its pages load their scripts by
# relative address, under a relative <base> it writes into each page, and its
# client takes the path it is served under from where its own script was loaded,
# for the API, Socket.IO and its router alike. Nothing in a page or a script is
# rewritten, so an update to Questarr's client cannot break ingress by moving a
# string. What is left for nginx is what the browser keeps outside the page:
# redirects and cookies.

user nginx;
daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Supervisor names the path in X-Ingress-Path. Only a value of the shape
    # Supervisor sends is used, and any other request keeps Questarr's own
    # redirects and cookies at the root, as the published port does.
    map $http_x_ingress_path $base_path {
        default '';
        '~^/api/hassio_ingress/[A-Za-z0-9_-]+$' $http_x_ingress_path;
    }

    # A browser keys cookies by host and path, never by port, so when Home
    # Assistant and the published port share a hostname, as
    # homeassistant.local:8123 and :5000 do, a session started on the published
    # port has its cookies sent to ingress too, at the root path, beside
    # ingress's own. Questarr's server keeps the last copy of a cookie and its
    # client the first, so with both present every write failed its CSRF check,
    # and signing out inside ingress left the published port's session signed
    # in. The browser sends the cookies of the longer path first, so ingress's
    # own copies are always ahead of the published port's.
    #
    # Only Questarr's two cookies are forwarded, and only once ingress has a
    # session of its own, marked by questarr_ingress below: then the first copy
    # of each is ingress's. Without it, any copy the browser sends belongs to
    # the published port, and ingress starts signed out rather than borrowing
    # that session, which signing out here could not end.
    map $http_cookie $questarr_ingress_session {
        default 0;
        '~(?:^|;\s*)questarr_ingress=1(?:;|$)' 1;
    }

    map $http_cookie $questarr_auth_cookie {
        default '';
        '~(?:^|;\s*)(?<auth_cookie>questarr_auth=[^;]*)' $auth_cookie;
    }

    map $http_cookie $questarr_csrf_cookie {
        default '';
        '~(?:^|;\s*)(?<csrf_cookie>questarr_csrf=[^;]*)' $csrf_cookie;
    }

    map "$questarr_ingress_session|$questarr_auth_cookie|$questarr_csrf_cookie" $questarr_cookie {
        default '';
        '~^1\|(?<only_auth>[^|]+)\|$' $only_auth;
        '~^1\|\|(?<only_csrf>[^|]+)$' $only_csrf;
        '~^1\|(?<both_auth>[^|]+)\|(?<both_csrf>[^|]+)$' '$both_auth; $both_csrf';
    }

    # Questarr sets its cookies on signing in and clears them on signing out,
    # questarr_auth first each time, and the marker follows it, with the same
    # lifetime. Questarr never reads it.
    map $upstream_http_set_cookie $questarr_ingress_marker {
        default '';
        '~^questarr_auth=;' 'questarr_ingress=; Path=$base_path/; Max-Age=0; HttpOnly; SameSite=Lax';
        '~^questarr_auth=[^;]' 'questarr_ingress=1; Path=$base_path/; Max-Age=604800; HttpOnly; SameSite=Lax';
    }

    server {
        listen 5001 default_server;

        # Supervisor is the only caller ingress has, and this port is not
        # published. Anything else on Home Assistant's network has the published
        # port, which serves the same Questarr at the root.
        allow 172.30.32.2;
        deny all;

        # Questarr sends a request for its root, and Express a request for a
        # folder without its trailing slash, to a root address, which would take
        # the frame to Home Assistant's own root. absolute_redirect off keeps
        # nginx from adding its own host and port, which the browser cannot
        # reach.
        absolute_redirect off;
        proxy_redirect ~^/(?<redirect_path>.*)$ $base_path/$redirect_path;
        # Questarr's session and CSRF cookies are set for the whole site, which
        # here is Home Assistant's. Kept to the ingress path, they reach no other
        # application, and Home Assistant never sees them.
        proxy_cookie_path / $base_path/;
        # An empty value sends no header, which is the case for every response
        # but signing in and out.
        add_header Set-Cookie $questarr_ingress_marker always;
        # Rebuilt from the maps above, so Home Assistant's own cookies, which
        # Questarr has no use for, stay behind as well.
        proxy_set_header Cookie $questarr_cookie;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Socket.IO is how Questarr pushes download progress and notifications
        # to the page, over a WebSocket where it can.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Questarr's largest upload is an 8 MB journal screenshot, and nginx
        # refuses anything over 1 MB by default. This is the most Supervisor
        # passes through ingress unstreamed, so nginx is never the tighter limit.
        client_max_body_size 16m;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        location / {
            proxy_pass http://127.0.0.1:5000;
        }
    }
}
