# nginx here serves one thing: Questarr to ingress, on 5001. The published
# port, 5000, is Questarr itself with nothing in front of it, so a reverse proxy
# and anything calling Questarr's API reach it exactly as they would without
# ingress.
#
# Ingress serves Questarr under a path Supervisor chooses,
# /api/hassio_ingress/<token>, and strips it before a request arrives here.
# Questarr is built for a proxy that does that: its pages load their scripts by
# relative address, under a relative <base> it writes into each page, and its
# client takes the path it is served under from where its own script was loaded,
# for the API, Socket.IO and its router alike. Nothing in a page or a script is
# rewritten, so an update to Questarr's client cannot break ingress by moving a
# string. What is left for nginx is what the browser keeps outside the page:
# redirects and cookies.

user nginx;
daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Supervisor names the path in X-Ingress-Path. Only a value of the shape
    # Supervisor sends is used, and any other request keeps Questarr's own
    # redirects and cookies at the root, as the published port does.
    map $http_x_ingress_path $base_path {
        default '';
        '~^/api/hassio_ingress/[A-Za-z0-9_-]+$' $http_x_ingress_path;
    }

    server {
        listen 5001 default_server;

        # Supervisor is the only caller ingress has, and this port is not
        # published. Anything else on Home Assistant's network has the published
        # port, which serves the same Questarr at the root.
        allow 172.30.32.2;
        deny all;

        # Questarr sends a request for its root, and Express a request for a
        # folder without its trailing slash, to a root address, which would take
        # the frame to Home Assistant's own root. absolute_redirect off keeps
        # nginx from adding its own host and port, which the browser cannot
        # reach.
        absolute_redirect off;
        proxy_redirect ~^/(?<redirect_path>.*)$ $base_path/$redirect_path;
        # Questarr's session and CSRF cookies are set for the whole site, which
        # here is Home Assistant's. Kept to the ingress path, they reach no other
        # application, and Home Assistant never sees them.
        proxy_cookie_path / $base_path/;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Socket.IO is how Questarr pushes download progress and notifications
        # to the page, over a WebSocket where it can.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Questarr's largest upload is an 8 MB journal screenshot, and nginx
        # refuses anything over 1 MB by default. This is the most Supervisor
        # passes through ingress unstreamed, so nginx is never the tighter limit.
        client_max_body_size 16m;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        location / {
            proxy_pass http://127.0.0.1:5000;
        }
    }
}
