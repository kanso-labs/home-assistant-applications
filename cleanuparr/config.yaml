arch:
  - aarch64
  - amd64
backup: cold
description:
  Removes stuck and unwanted downloads from the arr applications and their
  download clients. Cleanuparr watches the queues, strikes what is not
  progressing, and asks for a replacement.
image: 'ghcr.io/kanso-labs/home-assistant-application-cleanuparr'
init: false
map:
  - read_only: false
    type: app_config
  # Write access, because the orphaned files cleanup moves entries it no longer
  # recognises into a directory of its own and deletes them once they are old
  # enough. Every other part of Cleanuparr works through the download client
  # and arr APIs and touches nothing here.
  - read_only: false
    type: media
name: Cleanuparr
ports:
  11011/tcp: 11011
ports_description:
  11011/tcp: Web interface
slug: cleanuparr
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/cleanuparr'
version: '1.2.1' # x-release-please-version
webui: 'http://[HOST]:[PORT:11011]'
