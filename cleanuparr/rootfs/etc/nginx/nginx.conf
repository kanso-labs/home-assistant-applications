# nginx here serves one thing: Cleanuparr to ingress, on 11012. The published
# port, 11011, is Cleanuparr itself with nothing in front of it, so Traefik, the
# health checks and anything calling the API reach it exactly as before.
#
# Cleanuparr writes one URL base into every page, as
# window['_server_base_path'], and its frontend builds the base tag, every API
# call and the live-update hub from that one value. Ingress serves it under a
# path Supervisor chooses and strips before a request arrives here, so this
# writes that path into the page and passes everything else through untouched.
#
# Cleanuparr's own BASE_PATH would set it at the source instead, and is not used
# because of what it does to the published port: every address there would move
# under the ingress token, anything outside it would answer 404, and nginx
# would have to stand in front of 11011 too, adding the path back for every
# caller. Cleanuparr would then see each of them arrive from the loopback
# address, which "Disable Authentication for Local Addresses" counts as local.

# Ubuntu builds nginx with no user of its own, and its temporary directories
# belong to www-data.
user www-data;
daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Supervisor names the path in X-Ingress-Path. It lands inside a script in
    # the page, so only a value of the shape Supervisor sends is used, and any
    # other request is served at the root, as the published port serves it.
    map $http_x_ingress_path $base_path {
        default '/';
        '~^/api/hassio_ingress/[A-Za-z0-9_-]+$' $http_x_ingress_path;
    }

    server {
        listen 11012 default_server;

        # Supervisor is the only caller ingress has, and this port is not
        # published. Cleanuparr sees every request from here as coming from the
        # loopback address, which it counts as local, so anything else on Home
        # Assistant's network is left to the published port, where Cleanuparr
        # sees the caller's own address.
        allow 172.30.32.2;
        deny all;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # sub_filter cannot read a compressed page, so Cleanuparr is asked for
        # none. Supervisor asks for compression on every request and undoes it
        # before passing a response on, so the only hop this leaves
        # uncompressed is the one inside the machine.
        proxy_set_header Accept-Encoding '';
        # Live updates hold a WebSocket open for as long as the page is.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        location / {
            proxy_pass http://127.0.0.1:11011;
            # The exact text Cleanuparr writes, in ApiDI.cs. Should it ever
            # change, ingress shows a blank page while the published port keeps
            # working, and this line is what to look at.
            sub_filter "window['_server_base_path'] = '/'" "window['_server_base_path'] = '$base_path'";
            # Cleanuparr writes it ahead of every script in the page, three
            # times as of 2.10.10, and the frontend reads whichever came last.
            sub_filter_once off;
        }
    }
}
