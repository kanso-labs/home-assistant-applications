arch:
  - aarch64
  - amd64
backup: cold
# The artwork, which Radarr downloads again as it refreshes each movie, and the
# log files are left out, to keep the time Radarr is stopped for a backup short.
# So are logs.db and its -shm and -wal files, which Radarr creates again when
# they are missing. Their entry starts from the folder /config is kept in, so
# that its trailing wildcard matches nothing further down.
backup_exclude:
  - MediaCover
  - logs
  - '*_radarr/logs.db*'
description:
  Movie collection manager for Usenet and BitTorrent users. Radarr monitors
  multiple RSS feeds for new movies, talks to your download clients and indexers
  to grab them, and then sorts and renames what arrives.
image: 'ghcr.io/kanso-labs/home-assistant-application-radarr'
# nginx answers on 7878 for ingress and the published port alike, see DOCS.md.
ingress: true
ingress_port: 7878
# Supervisor reads a request through ingress whole and refuses one over 16 MiB,
# unless it is streamed. A backup restored from the System page can be larger.
ingress_stream: true
init: false
map:
  - read_only: false
    type: app_config
  - read_only: false
    type: media
  - read_only: false
    type: share
name: Radarr
panel_icon: 'mdi:filmstrip'
ports:
  7878/tcp: 7878
slug: radarr
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/radarr'
version: '1.2.3' # x-release-please-version
