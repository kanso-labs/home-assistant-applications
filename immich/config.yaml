arch:
  - aarch64
  - amd64
backup: cold
description:
  Self-hosted photo and video backup for your phones. Immich groups the faces in
  your library and finds photos by what is in them, with its machine learning in
  the Immich Machine Learning application.
image: 'ghcr.io/kanso-labs/home-assistant-application-immich'
init: false
map:
  # Read/write, and nothing else. The library lives in /media/immich rather
  # than /data: Home Assistant backups can leave /media out, and its network
  # storage can put a NAS there without moving anything. /data holds the
  # database alone, which Home Assistant backs up without it being mapped.
  - read_only: false
    type: media
name: Immich
options:
  hosts: []
ports:
  2283/tcp: 2283
# The options, and the fields of each host entry, are in the order the
# Configuration tab shows them, which is why they are not alphabetical.
schema:
  hosts:
    - name: match(^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*$)
      address: match(^([0-9]{1,3}(\.[0-9]{1,3}){3}|[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*)$)
  database_reader_password: password?
slug: immich
# How long Supervisor lets the application stop before Docker kills it, in
# seconds, up from its default of 10. Immich stops first and then PostgreSQL,
# whose shutdown checkpoint writes back as much of its 256MB cache as changed,
# and on slow storage that alone can take longer than 10 seconds. A database
# killed partway loses nothing, but its next start replays the log first.
timeout: 120
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/immich'
version: '1.0.3' # x-release-please-version
# Quick Sync video transcoding. This grants every GPU under /dev/dri, whatever
# its number, where a devices list grants only the nodes it names: renderD128
# alone, so a GPU that came up as renderD129 was never used. Nothing breaks
# without one.
video: true
webui: 'http://[HOST]:[PORT:2283]'
