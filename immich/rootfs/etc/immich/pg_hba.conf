# Who PostgreSQL lets in, and how. The server reads this file rather than the
# pg_hba.conf initdb wrote into /data/postgresql; see the postgres service.
#
# Immich connects as the superuser over the socket or the loopback address.
# Those are trusted because nothing outside this container can reach them.
local   all      all                       trust
host    all      all      127.0.0.1/32     trust
host    all      all      ::1/128          trust

# Other applications read the immich database as reader, by password, from
# Home Assistant's internal network. PostgreSQL listens there only once a
# read-only password is set in the options, and reader has no login without
# one. See DOCS.md.
host    immich   reader   samenet          scram-sha-256
