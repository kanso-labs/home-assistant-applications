arch:
  - aarch64
  - amd64
backup: cold
# Only the cache and log directories at the top of /config, which Bazarr+
# recreates at start. A bare name would also match any directory of that name
# further down, such as dogpile/cache in a Provider Hub provider's packages.
backup_exclude:
  - '*_bazarr-plus/cache'
  - '*_bazarr-plus/log'
description:
  Subtitle manager with a provider marketplace and AI translation. Bazarr+ is a
  fork of Bazarr that adds a plugin catalogue of subtitle providers, bilingual
  subtitles, and translation through OpenRouter or embedded tracks.
image: 'ghcr.io/kanso-labs/home-assistant-application-bazarr-plus'
# nginx answers on 6767 for ingress and the published port alike, see DOCS.md.
ingress: true
ingress_port: 6767
# Supervisor reads a request through ingress whole and refuses one over 16 MiB,
# unless it is streamed. A subtitle or Provider Hub package upload can be larger.
ingress_stream: true
init: false
map:
  - read_only: false
    type: app_config
  - read_only: false
    type: media
  - read_only: false
    type: share
name: Bazarr+
panel_icon: 'mdi:subtitles'
ports:
  6767/tcp: 6767
slug: bazarr-plus
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/bazarr-plus'
version: '1.1.1' # x-release-please-version
