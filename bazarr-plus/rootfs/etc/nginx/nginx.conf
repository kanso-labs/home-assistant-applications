# nginx here serves one thing: Bazarr+, on 6767, for ingress and the published
# port alike. Bazarr+ itself listens on 16767, and the nginx service writes the
# server for it at start, from the URL base in Bazarr+'s config.yaml.
# Debian builds nginx with no user of its own, and its temporary directories
# belong to www-data.
user www-data;
daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    # Bazarr+ runs under the ingress path as its URL base, so every address it
    # writes carries that path. The path has to go back onto requests on the way
    # in: Supervisor strips it before an ingress request arrives here, and
    # Traefik, Tdarr and everything else calling the published port never sends
    # it. On the way out, ingress needs the path left where Bazarr+ wrote it, and
    # the published port needs it taken out again, so that a browser at home
    # sees Bazarr+'s addresses as they were before ingress. The maps that name
    # the path are written beside the server, since only the nginx service
    # knows it.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Supervisor marks every ingress request with X-Ingress-Path. Anything
    # without it came in on the published port.
    map $http_x_ingress_path $from_ingress {
        default 1;
        '' 0;
    }

    # nginx cannot rewrite a compressed response, so the published port asks
    # Bazarr+ for an uncompressed one. Ingress gets what the browser asked for,
    # since nothing in it is rewritten.
    map $from_ingress $upstream_accept_encoding {
        1 $http_accept_encoding;
        0 '';
    }

    # A page opened on the published port under the path, a bookmark from
    # before this change most likely, is sent to the same page without it. API
    # callers do not ask for HTML, so they are answered where they asked.
    map "$from_ingress:$http_accept" $redirect_out_of_base {
        default 0;
        "~^0:.*text/html" 1;
    }

    # Bazarr+ locks an address out for five minutes after five wrong passwords,
    # and the address it goes by is the one its own frontend server was
    # connected from, whatever a header says. Every request from nginx came from
    # 127.0.0.1, so one client's wrong passwords locked everyone out. So nginx
    # connects from a loopback address made of the last three numbers of the
    # client's, 127.168.1.50 for 192.168.1.50, which is also the address Bazarr+
    # logs. Every 127.x.y.z address is the container's own, so nginx can connect
    # from any of them. Only the address nginx was connected from counts, so a
    # client cannot pick another, with one exception. Supervisor relays every
    # ingress request from 172.30.32.2, after Home Assistant has added the
    # address it was connected from to X-Forwarded-For and Supervisor has added
    # Home Assistant's, 172.30.32.1, after it. The address before that one is
    # the browser, and nothing a browser sends can come after it. Anything else
    # from 172.30.32.2 is one client, as is everything that comes through
    # Traefik, and an IPv6 client is 127.0.0.1, as before.
    map "$remote_addr $http_x_forwarded_for" $client_addr {
        default $remote_addr;
        "~^172\.30\.32\.2 (.*,)?\s*(?<via_home_assistant>\d{1,3}(\.\d{1,3}){3}),\s*172\.30\.32\.1$" $via_home_assistant;
    }

    map $client_addr $upstream_source {
        default 127.0.0.1;
        "~^\d{1,3}\.(?<client_low>\d{1,3}\.\d{1,3}\.\d{1,3})$" 127.$client_low;
    }

    # Bazarr+ reads the scheme from X-Forwarded-Proto. It marks its session
    # cookie Secure when that was https, and its live updates refuse a page
    # whose origin is not the scheme and host they were reached at, so behind
    # Traefik's https they failed on every poll. nginx itself only ever speaks
    # http, so the scheme is the one Traefik, or Home Assistant through ingress,
    # says it was. Only https is taken: a client that claims it over plain http
    # gets a cookie its own browser will not send back, and nobody else's
    # changes.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }

    include /etc/nginx/servers/*.conf;
}
