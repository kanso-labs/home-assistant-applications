# nginx here serves one thing: Bazarr+, on 6767, for ingress and the published
# port alike. Bazarr+ itself listens on 16767, and the nginx service writes the
# server for it at start, from the URL base in Bazarr+'s config.yaml.
# Debian builds nginx with no user of its own, and its temporary directories
# belong to www-data.
user www-data;
daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    # Bazarr+ runs under the ingress path as its URL base, so every address it
    # writes into a page already carries that path and nothing has to be
    # rewritten on the way out. The path has to go back onto requests on the way
    # in: Supervisor strips it before an ingress request arrives here, and
    # Traefik, Tdarr and everything else calling the published port never sends
    # it. A browser that came in on the published port then asks for the
    # prefixed addresses the page names, and those pass through as they are.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # A page opened on the published port without the path, a bookmark from
    # before ingress most likely, is sent to the same page under it, because
    # Bazarr+'s own router only matches addresses under its URL base. Supervisor
    # marks every ingress request with X-Ingress-Path, and those must never be
    # redirected: the browser would come back through ingress without the path,
    # and round again. API callers do not ask for HTML, so they are answered
    # where they asked.
    map $http_x_ingress_path $from_ingress {
        default 1;
        '' 0;
    }

    map "$from_ingress:$http_accept" $redirect_to_base {
        default 0;
        "~^0:.*text/html" 1;
    }

    include /etc/nginx/servers/*.conf;
}
