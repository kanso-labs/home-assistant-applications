# How the server the nginx service writes at start passes requests to Bazarr+.

# A restored backup and a subtitle upload come through here.
client_max_body_size 0;
proxy_request_buffering off;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Bazarr+'s frontend server replaces X-Forwarded-For with the address nginx
# connected from, so the client's address travels as that instead; see the
# maps in nginx.conf.
proxy_bind $upstream_source;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# Live updates hold a socket open for as long as the page is.
proxy_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
# Behind Traefik, an absolute redirect would name this port rather than the one
# the browser used.
absolute_redirect off;
