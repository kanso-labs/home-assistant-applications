# How the server the nginx service writes at start passes requests to Bazarr+.

# A restored backup and a subtitle upload come through here.
client_max_body_size 0;
proxy_request_buffering off;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Each one says what nginx saw rather than passing on what the client claimed,
# so Bazarr+ sees the address it saw before nginx was in front of it.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
# Live updates hold a socket open for as long as the page is.
proxy_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
# Behind Traefik, an absolute redirect would name this port rather than the one
# the browser used.
absolute_redirect off;
