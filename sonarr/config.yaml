arch:
  - aarch64
  - amd64
backup: cold
description:
  Smart PVR for Usenet and BitTorrent users. Sonarr monitors multiple RSS feeds
  for new episodes of the shows you follow, grabs them through your download
  clients and indexers, and then sorts and renames what arrives.
image: 'ghcr.io/kanso-labs/home-assistant-application-sonarr'
init: false
map:
  # Supervisor deprecated `addon_config` for `app_config` in 2026.07, but
  # frenck/action-addon-linter still only accepts the older spelling and has
  # had no release since 2025-11. Home Assistant's own apps-example runs the
  # same linter. Switch this once the linter's schema catches up.
  - read_only: false
    type: addon_config
  - read_only: false
    type: media
  - read_only: false
    type: share
name: Sonarr
ports:
  8989/tcp: 8989
slug: sonarr
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/sonarr'
version: '1.0.0' # x-release-please-version
webui: 'http://[HOST]:[PORT:8989]'
