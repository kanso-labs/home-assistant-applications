arch:
  - aarch64
  - amd64
backup: cold
description:
  Smart PVR for Usenet and BitTorrent users. Sonarr monitors multiple RSS feeds
  for new episodes of the shows you follow, grabs them through your download
  clients and indexers, and then sorts and renames what arrives.
image: 'ghcr.io/kanso-labs/home-assistant-application-sonarr'
# nginx answers on 8989 for ingress and the published port alike, see DOCS.md.
ingress: true
ingress_port: 8989
init: false
map:
  - read_only: false
    type: app_config
  - read_only: false
    type: media
  - read_only: false
    type: share
name: Sonarr
panel_icon: 'mdi:television-classic'
ports:
  8989/tcp: 8989
slug: sonarr
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/sonarr'
version: '1.1.3' # x-release-please-version
webui: 'http://[HOST]:[PORT:8989]'
