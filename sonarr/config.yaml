arch:
  - aarch64
  - amd64
backup: cold
# The artwork, which Sonarr downloads again as it refreshes each series, and the
# log files are left out, to keep the time Sonarr is stopped for a backup short.
# So are logs.db and its -shm and -wal files, which Sonarr creates again when
# they are missing. Their entry starts from the folder /config is kept in, so
# that its trailing wildcard matches nothing further down.
backup_exclude:
  - MediaCover
  - logs
  - '*_sonarr/logs.db*'
description:
  Smart PVR for Usenet and BitTorrent users. Sonarr monitors multiple RSS feeds
  for new episodes of the shows you follow, grabs them through your download
  clients and indexers, and then sorts and renames what arrives.
image: 'ghcr.io/kanso-labs/home-assistant-application-sonarr'
# nginx answers on 8989 for ingress and the published port alike, see DOCS.md.
ingress: true
ingress_port: 8989
# Supervisor reads a request through ingress whole and refuses one over 16 MiB,
# unless it is streamed. A backup restored from the System page can be larger.
ingress_stream: true
init: false
map:
  - read_only: false
    type: app_config
  - read_only: false
    type: media
  - read_only: false
    type: share
name: Sonarr
panel_icon: 'mdi:television-classic'
ports:
  8989/tcp: 8989
slug: sonarr
url: 'https://github.com/kanso-labs/home-assistant-applications/tree/main/sonarr'
version: '1.2.7' # x-release-please-version
