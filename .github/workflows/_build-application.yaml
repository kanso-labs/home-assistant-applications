name: Build application

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    # Read-only, because this job runs home-assistant/actions from its master
    # branch, and would otherwise inherit the caller's package and OIDC scopes.
    # Only build and manifest publish anything, and they ask for those scopes
    # themselves.
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      publish: ${{ steps.normalize.outputs.publish }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read application metadata
        id: info
        # Unpinned, as there is no release tag to pin. See AGENTS.md and
        # https://github.com/kanso-labs/home-assistant-applications/issues/482
        uses: home-assistant/actions/helpers/info@master
        with:
          path: './${{ inputs.app }}'

      - name: Normalize application metadata
        id: normalize
        # helpers/info writes each value as JSON, a quoted string or null. They
        # reach the script through the environment, and jq decodes them, so
        # nothing in a name or a description is ever read as shell.
        env:
          INFO_DESCRIPTION: ${{ steps.info.outputs.description }}
          INFO_IMAGE: ${{ steps.info.outputs.image }}
          INFO_NAME: ${{ steps.info.outputs.name }}
          INFO_URL: ${{ steps.info.outputs.url }}
          INFO_VERSION: ${{ steps.info.outputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          decode() { jq -r '. // empty | gsub("\n"; " ")' <<< "${1:-null}"; }
          image=$(decode "${INFO_IMAGE}")
          publish="${PUBLISH}"
          version=$(decode "${INFO_VERSION}")
          # An application naming no image is built by each Home Assistant
          # itself, and nothing of it may be published: Seadexerr is one, because
          # it carries no licence to redistribute it under. It is still built
          # here, under the name it would have had, to show that it builds.
          if [[ -z "${image}" ]]; then
            image="ghcr.io/kanso-labs/home-assistant-application-${{ inputs.app }}"
            publish=false
          fi
          # A version is published once. Every push to main builds what it
          # touched, and pushing that under the version already released would
          # hand an unreleased change to every fresh install, reinstall and
          # restore before release-please had cut anything. So once the
          # multi-arch tag exists the image is only built, as a check, until
          # the version moves. That tag is created only once every
          # architecture's image has been pushed, so a release whose build
          # failed partway publishes in full on Build's next hourly run, which
          # looks for released versions missing from the registry.
          #
          # imagetools inspect exits 1 alike for a missing version and for a
          # registry that did not answer, so its error is read. Only "not
          # found", or the 403 ghcr gives an anonymous lookup of a package that
          # does not exist yet, as a new application's does until its first
          # publish, counts as unpublished. Anything else is asked again, then
          # fails this build rather than push over a release, and the hourly
          # run publishes a release still missing once the registry answers.
          if [[ "${publish}" == 'true' ]]; then
            for attempt in 1 2 3; do
              if error=$(docker buildx imagetools inspect "${image}:${version}" 2>&1 > /dev/null); then
                echo "::notice::${image}:${version} is already published, so this build pushes nothing. Releasing a new version publishes it."
                publish=false
                break
              fi
              if grep -q -E ': not found$|failed to fetch anonymous token: .*: 403 Forbidden$' <<< "${error}"; then
                break
              fi
              if [[ "${attempt}" -eq 3 ]]; then
                echo "::error::Could not tell whether ${image}:${version} is published, so nothing is pushed: ${error//$'\n'/ }"
                exit 1
              fi
              sleep "$((attempt * 15))"
            done
          fi
          url=$(decode "${INFO_URL}")
          {
            echo "publish=${publish}"
            echo "image_name=${image##*/}"
            echo "registry_prefix=${image%/*}"
            echo "version=${version}"
            echo "name=$(decode "${INFO_NAME}")"
            echo "description=$(decode "${INFO_DESCRIPTION}")"
            if [[ -n "${url}" ]]; then
              echo "url=${url}"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          # Immich starts from upstream's multi-gigabyte server image. Exporting
          # those layers to the Actions cache after a publishing build, which has
          # already recompressed them for the image, kills BuildKit on every
          # run. They are pulled from upstream's registry either way, so the
          # cache saves nothing, and the registry's inline cache still applies.
          cache-gha: ${{ inputs.app != 'immich' }}
          cache-gha-scope: ${{ inputs.app }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: './${{ inputs.app }}'
          cosign: ${{ needs.prepare.outputs.publish == 'true' }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    timeout-minutes: 10
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
