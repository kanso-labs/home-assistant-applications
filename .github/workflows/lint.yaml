name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  find:
    name: Find applications
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Find applications
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

  lint:
    name: Lint ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run application linter
        uses: frenck/action-app-linter@v2.21.1
        with:
          path: './${{ matrix.path }}'

  verify:
    name: Verify release wiring
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Verify release wiring
        run: ./.github/scripts/verify-release-wiring.sh

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=npm depName=prettier
      PRETTIER_VERSION: '3.9.6'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Pinned, because an unpinned Prettier turns its next formatting change
      # into a red build on whichever pull request happens to be open at the
      # time, which tells that author nothing about their own work.
      - name: Check formatting
        run: npx --yes "prettier@${PRETTIER_VERSION}" --check .

  # Vite strips the site's types rather than checking them, so a type error
  # reaches the published page instead of the build log. `npm run typecheck` is
  # what notices, and nothing ran it until this job: a kanso-ui API that had
  # been removed under the site took the page blank for three days while the
  # build, and every other check here, stayed green.
  typecheck:
    name: Check types
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # The version docs/.tool-versions pins, so this check and a local one
      # resolve the same Node and npm. react-router typegen, which the
      # typecheck script runs first, warns on anything older.
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          cache: npm
          cache-dependency-path: docs/package-lock.json
          node-version-file: docs/.tool-versions

      - name: Install dependencies
        run: npm --prefix docs ci

      - name: Check types
        run: npm --prefix docs run typecheck

  # The shared action asks to be run as a step of a job the ruleset already
  # requires, because a check name nothing requires is advisory and can fail
  # without stopping anything. Here that guarantee comes from `confirm` instead:
  # it is the required name, and it fails when any job it needs does, so a job
  # of its own gates merges exactly as a step would.
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Lint workflows
        uses: kanso-labs/github-actions/actions/lint-workflows@v3.2.2

  # One job with a fixed name for branch protection to require. The linter runs
  # once per application, so its own check names change whenever an application
  # is added, and a forgotten name fails silently by never being required.
  #
  # The name predates the release wiring check and is left alone deliberately:
  # it is the name branch protection asks for, and renaming it would stop the
  # rule matching anything without saying so.
  confirm:
    name: Confirm lint succeeded
    runs-on: ubuntu-latest
    needs:
      - format
      - lint
      - lint-workflows
      - typecheck
      - verify
    if: always()
    steps:
      - name: Check the lint result
        env:
          RESULT: ${{ needs.lint.result }}
        run: |
          if [[ "${RESULT}" != 'success' ]]; then
            echo "At least one application failed linting (${RESULT})."
            exit 1
          fi

      - name: Check the workflow lint result
        env:
          RESULT: ${{ needs.lint-workflows.result }}
        run: |
          if [[ "${RESULT}" != 'success' ]]; then
            echo "Workflow linting failed (${RESULT})."
            exit 1
          fi

      - name: Check the release wiring result
        env:
          RESULT: ${{ needs.verify.result }}
        run: |
          if [[ "${RESULT}" != 'success' ]]; then
            echo "Release wiring verification failed (${RESULT})."
            exit 1
          fi

      - name: Check the formatting result
        env:
          RESULT: ${{ needs.format.result }}
        run: |
          if [[ "${RESULT}" != 'success' ]]; then
            echo "Formatting check failed (${RESULT})."
            exit 1
          fi

      - name: Check the type checking result
        env:
          RESULT: ${{ needs.typecheck.result }}
        run: |
          if [[ "${RESULT}" != 'success' ]]; then
            echo "Type checking failed (${RESULT})."
            exit 1
          fi
