name: Lint

on:
  push:
    branches:
      - main
  # Every pull request, not only those into main, because work here lands as
  # stacked pull requests, each based on the one below it.
  pull_request:
  schedule:
    - cron: '0 0 * * *'

# A newer push to a pull request makes the run in progress on it pointless, so
# that one is cancelled. Runs on main, pushes and the nightly one alike, are
# never cancelled.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: lint-${{ github.ref }}

permissions:
  contents: read

jobs:
  # One job, not one per application. The linter is a Docker action, and a step
  # runs it on a single path, so linting each application meant a job each:
  # 33 jobs that worked for 15 seconds apiece and waited minutes for a runner,
  # since a free organization runs 20 jobs at a time across every workflow. Its
  # image is built once here, at the tag Renovate moves, and run over every
  # application in turn.
  lint:
    name: Lint applications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-tags depName=frenck/action-app-linter
      APP_LINTER_VERSION: 'v2.21.1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build the application linter
        run: |
          docker build --quiet --tag app-linter \
            "https://github.com/frenck/action-app-linter.git#${APP_LINTER_VERSION}:src"

      # Every application is linted whatever fails before it, so a linter
      # change that rejects something several of them share shows its whole
      # reach in one run. The container sees the workspace where it would as an
      # action, so its annotations land on the same files.
      - name: Lint every application
        run: |
          failed=()
          for config in */config.yaml; do
            app="${config%/config.yaml}"
            echo "::group::${app}"
            if ! docker run --rm \
              --env INPUT_COMMUNITY=false \
              --env "INPUT_PATH=./${app}" \
              --volume "${PWD}:/github/workspace" \
              --workdir /github/workspace \
              app-linter; then
              failed+=("${app}")
            fi
            echo '::endgroup::'
          done
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "The linter rejected: ${failed[*]}"
            exit 1
          fi

  verify:
    name: Verify release wiring
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify release wiring
        run: ./.github/scripts/verify-release-wiring.sh

  # What AGENTS.md asks of every application and nothing else reads: key order,
  # translations, executable scripts, the s6 user bundle's location, icon and
  # logo sizes, the curated Renovate rule, a health check and download retries.
  # Each has slipped unnoticed before.
  applications:
    name: Verify applications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The check reads YAML with the package the site already pins, so it
      # installs the site's dependencies rather than anything of its own.
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          cache: npm
          cache-dependency-path: docs/package-lock.json
          node-version-file: docs/.tool-versions

      - name: Install dependencies
        run: npm --prefix docs ci

      - name: Verify applications
        run: node .github/scripts/verify-applications.mjs

  shellcheck:
    name: Check shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The release tag, v and all, which is also how the release names its
      # files.
      # renovate: datasource=github-releases depName=koalaman/shellcheck
      SHELLCHECK_VERSION: 'v0.11.0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Pinned rather than the runner's own copy, which moves with the runner
      # image and would turn a new warning into a red build on whatever pull
      # request is open at the time.
      - name: Install shellcheck
        run: |
          curl -J -L -f --retry 8 --retry-all-errors --retry-max-time 180 \
            -o "${RUNNER_TEMP}/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -x -J -f "${RUNNER_TEMP}/shellcheck.tar.xz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      # Every tracked script, found by its shebang, since s6's run and finish
      # files carry no extension, or by a `# shellcheck shell=` directive on its
      # first line, which is how a library that is only ever sourced, such as
      # NAT Gateway's rules.sh, says what it is. Most start
      # `with-contenv bashio`, a shell shellcheck does not know, so all of them
      # are read as bash. SC2154 is off because bashio and with-contenv supply
      # variables shellcheck cannot see. SC2155 is off until the shared finish
      # template stops tripping it, though it is the rule that catches
      # `export X="$(...)"` hiding a failure.
      - name: Check shell scripts
        run: |
          mapfile -t scripts < <(
            git ls-files | while IFS= read -r file; do
              if [[ -f "${file}" ]] && head -n 1 "${file}" | grep -q -E '^(#!.*[/ ](bash|sh|bashio)( |$)|# shellcheck shell=(bash|sh)$)'; then
                echo "${file}"
              fi
            done
          )
          echo "Checking ${#scripts[@]} scripts."
          shellcheck --shell=bash --severity=warning --exclude=SC2154,SC2155 "${scripts[@]}"

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=npm depName=prettier
      PRETTIER_VERSION: '3.9.10'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Pinned, because an unpinned Prettier turns its next formatting change
      # into a red build on whichever pull request happens to be open at the
      # time, which tells that author nothing about their own work.
      - name: Check formatting
        run: npx --yes "prettier@${PRETTIER_VERSION}" --check .

  # Vite strips the site's types rather than checking them, so a type error
  # reaches the published page instead of the build log. `npm run typecheck` is
  # what notices, and nothing ran it until this job: a kanso-ui API that had
  # been removed under the site took the page blank for three days while the
  # build, and every other check here, stayed green.
  #
  # The site's own build runs here too, rather than only in Deploy Pages, so that
  # it gates merges: Renovate automerges the site's dependencies once the
  # required checks pass, and a kanso-ui release that breaks the server build
  # fails `npm run build` while leaving the types and the dev server fine.
  typecheck:
    name: Check the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The version docs/.tool-versions pins, so this check and a local one
      # resolve the same Node and npm. react-router typegen, which the
      # typecheck script runs first, warns on anything older.
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          cache: npm
          cache-dependency-path: docs/package-lock.json
          node-version-file: docs/.tool-versions

      - name: Install dependencies
        run: npm --prefix docs ci

      - name: Check types
        run: npm --prefix docs run typecheck

      - name: Build the site
        run: ./.github/scripts/build-pages.sh

  # The shared action asks to be run as a step of a job the ruleset already
  # requires, because a check name nothing requires is advisory and can fail
  # without stopping anything. Here that guarantee comes from `confirm` instead:
  # it is the required name, and it fails when any job it needs does, so a job
  # of its own gates merges exactly as a step would.
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: kanso-labs/actions/lint-workflows@v4.3.0

  # One job with a fixed name for branch protection to require, so that adding
  # or renaming a job here never needs the ruleset changed, and a forgotten
  # name cannot fail silently by never being required.
  #
  # The name predates the release wiring check and is left alone deliberately:
  # it is the name branch protection asks for, and renaming it would stop the
  # rule matching anything without saying so.
  confirm:
    name: Confirm lint succeeded
    runs-on: ubuntu-latest
    needs:
      - applications
      - format
      - lint
      - lint-workflows
      - shellcheck
      - typecheck
      - verify
    if: always()
    timeout-minutes: 5
    steps:
      # Every job's result at once, so a run where several failed names them
      # all, and a job added to needs is covered without another step.
      - name: Check every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "${NEEDS}")
          if [[ -n "${failed}" ]]; then
            echo 'Lint did not succeed:'
            echo "${failed}"
            exit 1
          fi
