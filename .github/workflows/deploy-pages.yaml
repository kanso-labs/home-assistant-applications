name: Deploy Pages

# Pull requests build the site in Lint's site check, which merges wait on, so
# this runs only to publish.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pages publishes one deployment at a time. Queue rather than cancel, so the
# last push to main is the one that ends up published. The group is per ref, so
# a run dispatched from another branch can never take the place of a run from
# main still waiting its turn. The whole run is grouped, not only the deploy
# job, so that runs from main also build in push order and an older build
# finishing late cannot deploy last.
concurrency:
  cancel-in-progress: false
  group: pages-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      # The version docs/.tool-versions pins, so a local build and this one
      # resolve the same Node and npm.
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          cache: npm
          cache-dependency-path: docs/package-lock.json
          node-version-file: docs/.tool-versions

      # base_path is '' at a custom domain and '/home-assistant-applications' at
      # the project domain. The site is built for whichever Pages reports, so the
      # asset URLs and the router's basename match where it is actually served.
      - name: Build the site
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: ./.github/scripts/build-pages.sh

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '_site'

  deploy:
    name: Publish the site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
