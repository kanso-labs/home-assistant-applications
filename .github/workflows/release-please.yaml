name: Release Please

on:
  push:
    branches:
      - main
  # Releases are batched to one a day rather than one per merge. The push above
  # keeps the release pull request current — its changelog and every
  # application's version always reflect main — and this is the only trigger
  # that turns merging on, through the auto-merge input below.
  #
  # 09:00 UTC is 06:00 America/Sao_Paulo. Every kanso-labs repository releases
  # on this same cron.
  #
  # GitHub disables a scheduled workflow after 60 days without repository
  # activity. Renovate's commits keep this one alive, but that is the shape a
  # silent stop to releasing would take.
  schedule:
    - cron: '0 9 * * *'
  # Neither trigger above can be asked to look again now: one waits for a push,
  # the other for the clock. That matters when a release pull request has to be
  # discarded, because release-please rewrites one only when the release it
  # computes changes — so a pull request that cannot merge is not repaired by
  # closing it, and nothing proposes a replacement until somebody happens to
  # push. This is that lever.
  #
  # It matters more here than elsewhere: one release pull request carries every
  # application, so a stuck one holds up all thirteen rather than one package.
  workflow_dispatch:

# Every release merge pushes main, and every push starts a run. Five auto-merges
# landing inside a minute started five overlapping runs that tried to cut the
# same tags and strip the same labels, and one died on "Label does not exist".
# Do not add cancel-in-progress: the last push must still get a run, or the
# release it carries is never proposed.
#
# Batching the releases to one a day removes the condition that produced that
# race, since the merges no longer follow each other into main. The guard stays
# regardless: ordinary merges still push, and the next thing to land five of
# them inside a minute would find it gone.
#
# This stays in the caller rather than moving into the shared workflow. GitHub
# documents concurrency at the caller and says nothing either way about a group
# declared in a called workflow, and this guard only matters during exactly the
# race above — the worst kind of thing to rest on undocumented behaviour.
concurrency:
  cancel-in-progress: false
  group: release-please

# The application token below does the writing, so GITHUB_TOKEN stays on read.
permissions:
  contents: read

jobs:
  # Everything this used to do inline — minting the token, proposing the
  # releases, enabling auto-merge — now lives in the shared workflow, which the
  # other kanso-labs repositories call as well. What is left here is the part
  # that is genuinely this repository's: its concurrency group and its secrets.
  release-please:
    name: Propose releases
    uses: kanso-labs/github-actions/.github/workflows/_release-please.yaml@v3.2.1
    with:
      # True only on the scheduled run, which is what batches a day of merges
      # into one release. A push proposes without merging, and so does
      # workflow_dispatch — the lever above re-proposes a stuck release pull
      # request rather than releasing on demand. To release sooner than the next
      # scheduled run, enable auto-merge on the pull request by hand.
      #
      # v3.2.0 is the floor for this. Before it, auto-merge read the action's
      # prs output, which is empty on a run that finds the release pull request
      # already correct — the scheduled run's ordinary case, so an older pin
      # here would propose every day and merge on none of them.
      auto-merge: ${{ github.event_name == 'schedule' }}
    secrets:
      client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
      private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
