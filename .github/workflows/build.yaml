name: Build

on:
  # Every pull request, not only those into main, because work here lands as
  # stacked pull requests, each based on the one below it.
  pull_request:
  push:
    branches:
      - main
  # A push builds only the applications it changed, so a release whose image
  # failed to publish would otherwise stay unpublished until that application
  # next changes, and every install of the update would fail meanwhile. These
  # runs publish any released version missing from the registry. Hourly,
  # because a release can merge at any time of day.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init:
    name: Detect changed applications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      changed_apps: ${{ steps.filter.outputs.changed_apps }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: List changed files
        id: changed_files
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: tj-actions/changed-files@v47.0.6

      - name: Find applications
        id: apps
        # Unpinned, as there is no release tag to pin. See AGENTS.md and
        # https://github.com/kanso-labs/home-assistant-applications/issues/482
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Select changed applications
        id: filter
        env:
          APPS: ${{ steps.apps.outputs.addons }}
          # Deleted files included, since removing a script or a patch changes
          # the image as much as editing one.
          CHANGED_FILES:
            ${{ steps.changed_files.outputs.all_changed_and_modified_files }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          changed_apps=()

          if [[ "${EVENT}" == 'schedule' || "${EVENT}" == 'workflow_dispatch' ]]; then
            # Only main's versions are releases.
            if [[ "${REF}" != 'refs/heads/main' ]]; then
              echo "::error::Publishing missing releases runs on main only, not ${REF}."
              exit 1
            fi
            for app in ${APPS}; do
              config="${app}/config.yaml"
              image=$(sed -nE "s/^image:[[:space:]]*['\"]?([^'\"[:space:]#]+).*/\1/p" "${config}")
              version=$(sed -nE "s/^version:[[:space:]]*['\"]?([^'\"[:space:]#]+).*/\1/p" "${config}")
              # An application naming no image is never published.
              [[ -n "${image}" ]] || continue
              if ! docker buildx imagetools inspect "${image}:${version}" > /dev/null 2>&1; then
                echo "${image}:${version} is not published."
                changed_apps+=("${app}")
              fi
            done
          # If a workflow file itself changed, rebuild every application
          elif [[ "${CHANGED_FILES}" =~ \.github/workflows/(build|_build-application)\.yaml ]]; then
            read -ra changed_apps <<< "${APPS}"
          else
            for app in ${APPS}; do
              for file in ${CHANGED_FILES}; do
                [[ "${file}" == "${app}/"* ]] || continue
                # Home Assistant reads these from the repository, and no image
                # carries them. Anything else in the directory can reach the
                # image, as nginx-proxy-manager's patches do through a COPY
                # outside rootfs, so naming what to skip rather than what to
                # build keeps the next such COPY from going unbuilt.
                case "${file#"${app}/"}" in
                  CHANGELOG.md | DOCS.md | README.md | icon.png | logo.png | translations/*) ;;
                  *)
                    changed_apps+=("${app}")
                    break
                    ;;
                esac
              done
            done
          fi

          if [[ ${#changed_apps[@]} -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_apps=$(jq -nc '$ARGS.positional' --args "${changed_apps[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-application:
    name: Build ${{ matrix.app }}
    needs: init
    if: needs.init.outputs.changed == 'true'
    # Builds of one application on one ref run one at a time, so that a push
    # to main landing just after a release finds the tag that release
    # published and leaves it alone, instead of racing it to the registry.
    # Nothing is cancelled, but GitHub keeps only the newest run waiting in a
    # group, which is why each application has its own: one group for the
    # whole workflow would let a third push drop the second push's builds, and
    # those are the only builds its applications get. A build dropped this way
    # always has a newer build of the same application waiting behind it. On a
    # pull request, where nothing is published, a newer push makes the build in
    # progress pointless, so that one is cancelled.
    concurrency:
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
      group: build-${{ github.ref }}-${{ matrix.app }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.changed_apps) }}
      max-parallel: 2
    uses: ./.github/workflows/_build-application.yaml
    with:
      app: ${{ matrix.app }}
      publish:
        ${{ github.event_name != 'pull_request' && github.ref ==
        'refs/heads/main' }}

  # One job with a fixed name for branch protection to require. The build runs
  # only for the applications a pull request touches, so its own check names are
  # absent on any pull request that changes none of them, and requiring those
  # directly would block every such pull request forever.
  confirm:
    name: Confirm builds succeeded
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [init, build-application]
    if: always()
    steps:
      - name: Check the build result
        env:
          DETECT: ${{ needs.init.result }}
          BUILD: ${{ needs.build-application.result }}
        run: |
          if [[ "${DETECT}" != 'success' ]]; then
            echo "Detecting the changed applications failed (${DETECT})."
            exit 1
          fi

          case "${BUILD}" in
            success) ;;
            skipped) echo 'No application changed, so nothing was built.' ;;
            *)
              echo "At least one application failed to build (${BUILD})."
              exit 1
              ;;
          esac
