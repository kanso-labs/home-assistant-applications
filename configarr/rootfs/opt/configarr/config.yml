# Configarr configuration.
#
# Seeded on first start and never overwritten afterwards. The reference for
# every key is at https://configarr.de/docs/configuration/config-file.
#
# Nothing is configured below, so a sync clones the guides, finds no instance
# to write to, and changes nothing. Uncomment the block for each application
# Configarr should manage, fill in its address and API key, and restart.
#
# base_url is where Configarr finds that application. The Sonarr and Radarr in
# this repository are at http://2dd33fbd-sonarr:8989 and
# http://2dd33fbd-radarr:7878, their hostnames inside Home Assistant, when the
# repository was added by the address in its README. Otherwise use the Hostname
# shown on that application's Info tab. A Sonarr or Radarr running anywhere
# else keeps the address you already use for it.
#
# API keys belong in secrets.yml beside this file, and are referenced here with
# !secret. Each arr application prints its own under Settings, then General.

trashGuideUrl: https://github.com/TRaSH-Guides/Guides
recyclarrConfigUrl: https://github.com/recyclarr/config-templates
